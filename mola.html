<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1c1410"/>
<title>Kizilkayalar · Mola Takip</title>
<link rel="manifest" href="mola-manifest.webmanifest"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mola Takip"/>
<link rel="apple-touch-icon" href="mola-icon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--bg:#f5f2ee;--navy:#1c1410;--orange:#ea580c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding-bottom:96px}
header{background:linear-gradient(180deg,#1c1410,#2a1c16);color:#fff;padding:14px 16px 16px}
.brand{display:flex;justify-content:center}
.brand img{height:46px;width:auto;max-width:92%;background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:#e7e5e4}
.meta b{color:#fdba74}
.wrap{padding:14px}
.search{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:16px;display:flex;gap:8px}
.search input{flex:1;border:0;outline:0;font:inherit;background:transparent}
.search .ekle{border:0;background:var(--orange);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700}
.sec{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 2px 10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sec:before{content:"";width:8px;height:8px;border-radius:99px;background:#a8a29e}
#outTitle:before{background:#ef4444}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,20,16,.05);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.card.iceri:before{background:#22c55e}.card.disari:before{background:#ef4444}
.card.iceri{background:linear-gradient(90deg,#f0fdf4 0%,#fff 28%)}
.card.disari{background:linear-gradient(90deg,#fef2f2 0%,#fff 28%)}
.grid{display:grid;grid-template-columns:76px 1fr 62px;gap:10px;align-items:center}
.btns{display:flex;flex-direction:column;gap:7px}
.btns button{border:0;border-radius:12px;padding:11px 0;color:#fff;font-weight:700;font-size:13px}
.bout{background:#16a34a}.bin{background:#dc2626}.bin[disabled]{background:#dcfce7;color:#166534}
.mid{text-align:center}.name{font-weight:800;font-size:14px}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.badge{display:inline-block;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:99px}
.card.iceri .badge{color:#166534;background:#dcfce7}.card.disari .badge{color:#991b1b;background:#fee2e2}
.asim{margin-top:7px;color:#991b1b;font-weight:800;font-size:12px}
.right{text-align:right;font-size:11px;color:var(--muted)}.right b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.right button{display:block;width:100%;border:0;background:none;padding:4px 0;text-align:right;color:#a8a29e;font-weight:700}
.hist{margin-top:10px;padding-top:8px;border-top:1px dashed #e7e5e4;font-size:12px;color:#57534e}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 68px 1fr;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.bar button{border:0;border-radius:14px;padding:14px 0;color:#fff;font-weight:800}
.rapor{background:#1c1410}.sifir{background:#44403c}
.mic{width:60px;height:60px;border-radius:50%;background:linear-gradient(180deg,#f97316,#c2410c);margin:auto;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 20px rgba(194,65,12,.35)}
.mic.listen{background:linear-gradient(180deg,#22c55e,#15803d)}
.modal{position:fixed;inset:0;background:rgba(28,20,16,.48);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-height:84vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 24px}
.tabs{display:flex;gap:8px;margin:10px 0 14px;background:#f5f5f4;padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font-weight:700;color:#78716c}
.tabs button.on{background:#1c1410;color:#fff}
.row{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1c1410;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:30;font-size:13px;max-width:90%}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="kizil-logo.svg" alt="Kizilkayalar"/></div>
  <div class="meta"><span>Personel mola · <b>45 dk</b> · asim 7 TL</span><span id="saat"></span></div>
</header>
<div class="wrap">
  <div class="search">
    <input id="q" placeholder="Ara / Ekle" oninput="render()" onkeydown="if(event.key==='Enter')addOrFilter()"/>
    <button class="ekle" onclick="addOrFilter()">Ekle</button>
  </div>
  <div class="sec" id="outTitle">Su an disarida (0)</div>
  <div id="outList"></div>
  <div class="sec">Iceride</div>
  <div id="inList"></div>
</div>
<div class="bar">
  <button class="rapor" onclick="openRapor('gun')">Rapor</button>
  <div class="mic" id="mic" onclick="dinle()">🎙️</div>
  <button class="sifir" onclick="sifirla()">Sifirla</button>
</div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="https://raw.githack.com/n4dch4gz4c-hue/cadde-mesai-listesi/f0b7254c7f27bb6b9fd518331f42477a5c08324f/mola.html"></script>
</body>
</html>
