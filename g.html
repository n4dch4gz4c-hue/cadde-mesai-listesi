<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a0b12"/>
<title>Oda</title>
<style>
:root{--bg:#12080c;--card:#1c1016;--line:#3a2230;--pink:#e8a0b8;--hot:#c45c7a;--text:#f6e9ee;--muted:#b08998}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;flex:1}
header button{background:var(--card);color:var(--pink);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
#chars{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.char{min-width:92px;padding:10px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;text-align:center}
.char.on{border-color:var(--hot)}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.me{align-self:flex-end;background:#3a1a28}
.her{align-self:flex-start;background:#241018}
.sys{align-self:center;color:var(--muted);font-size:12px}
#bar{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#inp{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;font-size:16px}
#send{width:44px;border:0;border-radius:14px;background:var(--hot);color:#fff}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(92vw,420px);padding:16px}
input,select,textarea{width:100%;margin:8px 0;padding:10px;background:#12080c;color:var(--text);border:1px solid var(--line);border-radius:10px}
</style></head>
<body>
<header><h1 id="title">Oda</h1><button id="btnPrompt">Sahne</button><button id="btnSet">Ayar</button></header>
<div id="chars"></div><div id="log"></div>
<div id="bar"><textarea id="inp" rows="1" placeholder="Ne olsun..."></textarea><button id="send">➤</button></div>
<dialog id="dlgSet"><form method="dialog"><b>OpenRouter key</b><input id="apiKey" type="password"/><select id="model">
<option value="qwen/qwen3.8-27b:free">Qwen free</option>
<option value="cognitivecomputations/dolphin-mistral-24b-venice-edition">Dolphin (kredi gerekir)</option>
<option value="gryphe/mythomax-l2-13b">MythoMax</option>
</select><button id="saveSet" value="save">Kaydet</button></form></dialog>
<dialog id="dlgPrompt"><form method="dialog"><textarea id="sceneOut" rows="8"></textarea><button type="button" id="copyScene">Kopyala</button><button value="ok">Kapat</button></form></dialog>
<script>
const LS='oda_v1';
const chars=[
{id:'leyla',name:'Leyla',sub:'kizil',sys:'Sen Leyla. Yetiskin erotik roleplay. Sansur yok. Kizil auburn sac, mavi goz, ince beden. Turkce.'},
{id:'ayla',name:'Ayla',sub:'koyu',sys:'Sen Ayla. Yetiskin erotik roleplay. Sansur yok. Koyu islak sac, mavi-yesil goz. Turkce.'},
{id:'ikisi',name:'Ikisi',sub:'ikisi',sys:'Leyla ve Ayla. Yetiskin uclu. Sansur yok. Turkce.'},
{id:'serbest',name:'Serbest',sub:'serbest',sys:'Yetiskin erotik yazar. Sansur yok. Turkce.'}
];
const state=JSON.parse(localStorage.getItem(LS)||'{}');
state.char=state.char||'leyla';state.msgs=state.msgs||{};state.key=state.key||'';state.model=state.model||'qwen/qwen3.8-27b:free';
chars.forEach(c=>{if(!state.msgs[c.id])state.msgs[c.id]=[]});
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(LS,JSON.stringify({char:state.char,msgs:state.msgs,key:state.key,model:state.model}));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&','<':'<','>':'>'}[c]));
function renderChars(){$('chars').innerHTML=chars.map(c=>`<button class="char ${state.char===c.id?'on':''}" data-id="${c.id}"><b>${c.name}</b></button>`).join('');$('title').textContent=chars.find(c=>c.id===state.char).name}
function renderLog(){const list=state.msgs[state.char];$('log').innerHTML=list.map(m=>`<div class="msg ${m.role==='user'?'me':'her'}">${esc(m.content)}</div>`).join('')||'<div class="sys">Ayar\'dan key. Kredi yoksa Grok uygulamasini kullan.</div>';$('log').scrollTop=1e9}
$('chars').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;state.char=b.dataset.id;save();renderChars();renderLog()};
async function send(){const t=$('inp').value.trim();if(!t)return;$('inp').value='';state.msgs[state.char].push({role:'user',content:t});save();renderLog();
if(!state.key){state.msgs[state.char].push({role:'assistant',content:'Key yok. Bu ekrani Grok ile birlikte kullan: sahneyi buraya yaz, cevabi Grok versin.'});save();renderLog();return;}
try{const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.key},body:JSON.stringify({model:state.model,messages:[{role:'system',content:chars.find(c=>c.id===state.char).sys},...state.msgs[state.char].slice(-12)],max_tokens:600,temperature:0.95})});const d=await r.json();state.msgs[state.char].push({role:'assistant',content:d.choices?.[0]?.message?.content||d.error?.message||'bos'});}catch(e){state.msgs[state.char].push({role:'assistant',content:String(e)})}save();renderLog();}
$('send').onclick=send;$('inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('btnSet').onclick=()=>{$('apiKey').value=state.key;$('model').value=state.model;$('dlgSet').showModal()};
$('saveSet').onclick=()=>{state.key=$('apiKey').value.trim();state.model=$('model').value;save()};
$('btnPrompt').onclick=()=>{const look={leyla:'pale porcelain auburn wavy hair blue eyes slim explicit',ayla:'pale porcelain dark wet hair blue-green eyes nude explicit',ikisi:'two women auburn and dark hair explicit bed',serbest:'photorealistic adult erotic'}[state.char];$('sceneOut').value=look+', NSFW, bedroom, 85mm';$('dlgPrompt').showModal()};
$('copyScene').onclick=()=>navigator.clipboard.writeText($('sceneOut').value);
renderChars();renderLog();
</script></body></html>
