<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f1ea;color:#1f2933}
.header{background:#1f4b8f;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{margin:0;font-size:20px}
button{padding:8px 14px;border:1px solid #d7cfc3;background:#fff;border-radius:8px;cursor:pointer;font-weight:600}
button.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
select,input{padding:8px;border:1px solid #d7cfc3;border-radius:6px}
.table-wrap{overflow:auto;padding:0 16px 20px;max-height:75vh}
table{border-collapse:collapse;width:100%;min-width:1200px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:8px 4px;position:sticky;top:0;z-index:2}
td{border:1px solid #eadfd2;padding:4px;text-align:center}
td.name{text-align:left !important;font-weight:700;min-width:180px;padding-left:8px;}
input.cell{width:60px;text-align:center;border:1px solid #ddd;border-radius:4px;padding:4px;background:#fff8e6}
.formula{background:#e8f5e9;font-weight:700}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}
.stats{display:flex;gap:12px;padding:12px 16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:8px;padding:10px 14px;min-width:140px}
.stat b{display:block;font-size:18px;color:#1f4b8f}
@media (max-width: 768px) {
  body { padding: 6px; }
  .header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; }
  table { font-size: 11px; min-width: 700px; }
  input.cell { width: 48px; }
}
</style>
</head>
