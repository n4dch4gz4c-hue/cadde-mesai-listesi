<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Kurye"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/kk-logo.png"/>
<title>Kurye Havuz</title>
<style>
html,body{min-height:100%}
body{margin:0;font-family:system-ui;color:#eef3ff;
  background:linear-gradient(165deg,#0a1628 0%,#12304a 45%,#0b1220 100%);
  background-attachment:fixed}
header{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center;
  background:rgba(11,18,32,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
h1{margin:0;font-size:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:36px;width:auto;display:block}
#who{color:#c5d4ea;font-size:13px}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tabs button{flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;padding:10px;border-radius:10px;font-weight:700;backdrop-filter:blur(12px)}
.tabs button.on{background:rgba(59,130,246,.45);border-color:rgba(147,197,253,.5)}
.wrap{padding:12px 16px 40px}
.card{background:rgba(21,29,46,.42);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;margin-bottom:10px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card.warn{background:rgba(234,179,8,.18);border-color:rgba(234,179,8,.45)}
.card.late{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.card.done{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.4)}
.id{color:#93c5fd;font-weight:800;display:flex;align-items:center;gap:8px}
.tick{width:22px;height:22px;accent-color:#22c55e}
.badge{display:inline-block;margin-left:8px;font-size:11px;background:#22c55e;color:#052e16;padding:2px 8px;border-radius:999px;font-weight:800;vertical-align:middle}
.ty{width:28px;height:28px;border-radius:50%;margin-left:8px;vertical-align:middle;object-fit:cover;background:#F27A1A}
.meta{color:#dbe7f5;font-size:14px;margin:8px 0;line-height:1.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button,.btns a{flex:1;min-width:30%;text-align:center;text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px;font-weight:700;color:#fff;background:rgba(51,65,85,.45);backdrop-filter:blur(10px)}
.go{background:rgba(34,197,94,.75)!important;color:#052e16!important;border-color:transparent!important}
.ara{background:rgba(37,99,235,.85)!important}
.harita{background:rgba(14,165,233,.9)!important;color:#022c3a!important;border-color:transparent!important;position:relative;z-index:2}
.off{background:rgba(20,83,45,.55)!important;color:#bbf7d0!important}
select,input.full,button.full{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(11,18,32,.45);color:#fff;font-size:16px;margin:8px 0;backdrop-filter:blur(12px)}
.pad{padding:16px}
.saat{color:#94a3b8;font-size:12px;font-weight:700;margin-top:4px}
.link{background:none;border:0;color:#93c5fd;font-size:13px}
.say{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.say span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;font-size:13px;backdrop-filter:blur(12px)}
.say b{display:block;font-size:20px;color:#fff}
.icerik{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.icerik.on{display:block}
.icerik .ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:#e8f0fa}
.icerik .ln em{color:#94a3b8;font-style:normal;margin-right:6px}
.odeme{margin-top:6px;font-size:13px;font-weight:800}
.odeme.onl{color:#86efac}
.odeme.kas{color:#fde68a}
.badge-on{background:#14532d;color:#bbf7d0;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:6px}
.badge-off{background:#3a2e0a;color:#fde68a;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:6px}
</style>
</head>

    <div><h1>Kurye Havuz</h1><div id="who">Sefim</div></div>
  </div>
  <button class="link" onclick="cikis()">Cikis</button>
</header>
<div id="login" class="pad">
  <div>Kurye sec</div>
  <select id="name" onchange="onCourierPick()"><option value="">Seciniz</option></select>
  <div id="passHint" class="saat"></div>
  <input id="pass" class="full" type="password" placeholder="Parola" autocomplete="current-password" onkeydown="if(event.key==='Enter')enter()"/>
  <input id="pass2" class="full" type="password" placeholder="Parolayi tekrar" autocomplete="new-password" hidden onkeydown="if(event.key==='Enter')enter()"/>
  <button class="go full" id="enterBtn" onclick="enter()">Giris</button>
  <button class="link" id="modeLink" type="button" onclick="togglePassMode()" hidden>Ilk kez giriyorum</button>
</div>
<div id="app" hidden>
  <div class="tabs">
    <button class="on" id="t2">Uzerimde</button>
  </div>
  <div id="resetBox" class="pad" hidden>
    <div>Ali: kurye sifre sifirla</div>
    <select id="resetWho"><option value="">Kurye sec</option></select>
    <input id="resetPass" class="full" type="text" placeholder="Yeni parola" autocomplete="off"/>
    <button class="full" onclick="sifirla()">Sifreyi kaydet</button>
  </div>
  <div id="sums" class="pad" hidden></div>
  <div id="monthBox" class="pad" hidden></div>
  <div id="ucretBox" class="pad" hidden></div>
  <div class="wrap" id="list"></div>
</div>
<script>
let me = localStorage.getItem("kurye_ad") || "";
let cid = localStorage.getItem("kurye_id") || "";
let token = localStorage.getItem("kurye_token") || "";
let full = localStorage.getItem("kurye_full") === "1";
let ali = localStorage.getItem("kurye_ali") === "1";
let view = "benim";
let openIds = {};
let lineCache = {};
async function loadCouriers(){
  const j = await (await fetch("/api/couriers")).json();
  const sel = document.getElementById("name");
  sel.innerHTML = '<option value="">Seciniz</option>' +
    (j.couriers||[]).map(c => '<option value="'+c.id+'">'+c.name+'</option>').join("");
  if(cid) sel.value = cid;
  const rw = document.getElementById("resetWho");
  if (rw) {
    rw.innerHTML = '<option value="">Kurye sec</option>' +
      (j.couriers||[]).filter(function(c){ return !isShelAli(c.name); }).map(c => '<option value="'+c.id+'">'+c.name+'</option>').join("");
  }
  onCourierPick();
}
let passMode = "login";
function selectedName(){
  const sel = document.getElementById("name");
  return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
}
function showPassMode(mode){
  passMode = mode;
  const pass = document.getElementById("pass");
  const pass2 = document.getElementById("pass2");
  const hint = document.getElementById("passHint");
  const btn = document.getElementById("enterBtn");
  const link = document.getElementById("modeLink");
  pass.value = "";
  pass2.value = "";
  if (mode === "none") {
    pass.hidden = true;
    pass2.hidden = true;
    link.hidden = true;
    hint.textContent = "Ali sifresiz girer";
    btn.textContent = "Giris";
    return;
  }
  pass.hidden = false;
  if (mode === "setup") {
    pass2.hidden = false;
    pass.placeholder = "Yeni parola";
    hint.textContent = "Ilk giris: sifreni belirle, kaydedilecek";
    btn.textContent = "Kaydet ve gir";
    link.hidden = false;
    link.textContent = "Sifrem var";
    return;
  }
  pass2.hidden = true;
  pass.placeholder = "Parola";
  hint.textContent = "";
  btn.textContent = "Giris";
  link.hidden = false;
  link.textContent = "Ilk kez giriyorum";
}
function togglePassMode(){
  if (isShelAli(selectedName())) return;
  showPassMode(passMode === "setup" ? "login" : "setup");
}
async function onCourierPick(){
  const sel = document.getElementById("name");
  const id = sel.value;
  const name = selectedName();
  if (!id) {
    showPassMode("login");
    document.getElementById("passHint").textContent = "";
    document.getElementById("modeLink").hidden = true;
    return;
  }
  if (isShelAli(name)) {
    showPassMode("none");
    return;
  }
  document.getElementById("passHint").textContent = "Kontrol ediliyor...";
  try {
    const j = await (await fetch("/api/password-status?id=" + encodeURIComponent(id))).json();
    if (document.getElementById("name").value !== id) return;
    if (j && j.hasPassword === true) showPassMode("login");
    else if (j && j.hasPassword === false) showPassMode("setup");
    else showPassMode("login");

function digitsOnly(s){ return String(s||"").replace(/\D/g,""); }
function splitPhones(raw){
  raw = String(raw||"");
  let mh = "", sip = "";
  const dash = raw.split("-");
  if (dash.length >= 2) {
    mh = digitsOnly(dash[0]);
    sip = digitsOnly(dash.slice(1).join("-"));
  } else {
    const m = raw.match(/0?5\d{9}/);
    if (m) mh = m[0].length === 10 ? "0"+m[0] : m[0];
    const parts = raw.match(/\d[\d\s]+/g) || [];
    const nums = parts.map(function(x){ return digitsOnly(x); }).filter(function(p){ return p.length >= 7; });
    if (!mh) mh = nums[0] || "";
    sip = nums.filter(function(p){ return p !== digitsOnly(mh); })[0] || "";
  }
  if (mh.length === 10 && mh.charAt(0) !== "0") mh = "0" + mh;
  return { mh: mh, sip: sip, mobile: /^0?5\d{9}$/.test(mh) };
}
function telHref(p){
  const x = splitPhones(p);
  if (x.mobile && x.mh) return "tel:+90" + x.mh.replace(/^0/, "");
  if (x.mh && x.sip) return "tel:" + x.mh + ",,," + x.sip;
  if (x.mh) return "tel:" + x.mh;
  return "";
}
async function tuslaPhone(raw){
  const x = splitPhones(raw);
  const n = x.sip || "";
  if (!n) { alert("Uzun siparis no yok"); return; }
  try { await navigator.clipboard.writeText(n); alert("Tusla kopyalandi: " + n); }
  catch(e){ alert(n); }
}

function sameKur(a,b){
  function n(s){ return String(s||"").toLocaleLowerCase("tr").replace(/[.\s]+/g," ").trim(); }
  function key(s){ return n(s).split(" ").filter(Boolean).sort().join(" "); }
  function oneOff(p,q){
    if (p === q) return true;
    if (Math.abs(p.length - q.length) > 1) return false;
    if (p.length === q.length) {
      var d = 0;
      for (var i = 0; i < p.length; i++) if (p[i] !== q[i]) d++;
      return d === 1;
    }
    var short = p.length < q.length ? p : q;
    var long = p.length < q.length ? q : p;
    var i2 = 0, j2 = 0, skip = 0;
    while (i2 < short.length && j2 < long.length) {
      if (short[i2] === long[j2]) { i2++; j2++; }
      else { skip++; j2++; if (skip > 1) return false; }
    }
    return skip <= 1;
  }
  var x=n(a), y=n(b);
  if(!x || !y) return false;
  if (x===y || x.indexOf(y)>=0 || y.indexOf(x)>=0 || key(a)===key(b)) return true;
  var xa = x.split(" ").filter(Boolean).sort();
  var yb = y.split(" ").filter(Boolean).sort();
  if (xa.length < 2 || xa.length !== yb.length) return false;
  var diff = 0;
  for (var k = 0; k < xa.length; k++) {
    if (xa[k] === yb[k]) continue;
    diff++;
    if (diff > 1 || !oneOff(xa[k], yb[k])) return false;
  }
  return diff === 1;
}
