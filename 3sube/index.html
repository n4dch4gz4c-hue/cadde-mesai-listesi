<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>3 Şube Mesai Listesi</title>
<style>
html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933}
.bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
h1{margin:0;font-size:22px}
.btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
.btn.sync{background:#0f7b4c;color:#fff;border-color:#0f7b4c}
table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:3px 4px;text-align:center;color:#111}
td.name{text-align:left;font-weight:700}
tr.pay td.tot{background:#f3e8d2;font-weight:700}
input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px;font-size:14px;width:64px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 12px}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px}
.table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh}
.branch-bar{display:flex;gap:6px;margin-left:12px}
.branch-bar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 14px;border-radius:20px}
.branch-bar button.active{background:#fff;color:#0f172a;font-weight:bold}
.hide{display:none!important}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:9}
@media(max-width:900px){
  html,body{background:#0b1220!important}
  header.bar{background:#121a2b!important;color:#fff}
  .stats{grid-template-columns:1fr 1fr}
  .stat{background:#1a2438!important;border-color:#2a3a55!important;color:#fff}
  .table-wrap{display:none}
  #mobileList{display:block!important;padding:8px 12px 32px}
  .mrow{background:#fff;border-radius:16px;padding:12px;margin:8px 0}
}
#mobileList{display:none}
</style>
</head>
<body>
<header class="bar" style="background:#0b1220;color:#fff">
  <div>
    <h1>3 Şube Mesai Listesi</h1>
    <p id="pageSub" style="margin:2px 0 0;font-size:13px;opacity:.85"></p>
  </div>
  <div class="branch-bar" id="bar"></div>
  <div class="row">
    <input id="q" placeholder="İsim ara..." oninput="render()">
    <button class="btn sync" onclick="toast('Çek (şimdilik yerel)')">Çek</button>
    <button class="btn primary" onclick="save()">Kaydet</button>
    <button class="btn" onclick="toast('Senkron hazırlanıyor')">Senkron</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="backup()">Yedek</button>
    <button class="btn" onclick="toast('PDF hazırlanıyor')">PDF</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste</button>
  <button class="tab" data-tab="duzenle" onclick="tab(this)">Düzenleme</button>
  <button class="tab" data-tab="kurye" id="tab-kurye" onclick="tab(this)">Kurye</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Ceza</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Özet</button>
  <button class="tab" data-tab="rapor" onclick="tab(this)">Aylık rapor</button>
</nav>

<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>No</th><th>Ad Soyad</th>
          <th>Mesai saat</th><th>Mesai tutar</th>
          <th>HS adet</th><th>HS tutar</th>
          <th>Prim</th><th>Yol</th>
          <th>İzin gün</th><th>İzin tutar</th>
          <th>Yıllık</th><th>Disiplin</th><th>Toplam</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="mobileList"></div>
</section>

<section id="sec-duzenle" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Düzenleme: kişi ekle/sil/sırala buradan yapılabilir.</div></section>
<section id="sec-kurye" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Kurye primleri (sadece Cadde).</div></section>
<section id="sec-devam" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Devamsızlık sekmesi.</div></section>
<section id="sec-ceza" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Ceza sekmesi.</div></section>
<section id="sec-ozet" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Özet sekmesi.</div></section>
<section id="sec-rapor" class="hide"><div class="panel" style="margin:16px;padding:16px;background:#fff;border-radius:12px">Aylık rapor sekmesi.</div></section>

<div id="toast"></div>

<script>
var BRANCHES=["Kadıköy","Cadde","Cengelkoy"];
var KEY="3sube_mesai_v5";
var RATES={
  "Kadıköy":{saat:320,izin:2900,hs:2500},
  "Cadde":{saat:320,izin:2900,hs:2500},
  "Cengelkoy":{saat:280,izin:2800,hs:2000}
};
var SEED={
  "Kadıköy":["ÖZAY ALSAN","ABDULKADİR AKYÜZ","MUHAMMED AKYÜZ","SEDAT KIZILKAYA","MAHMUT TEKER","İSRAFİL ÖZTÜRK","CAFER KOCA","İSA AKYILDIZ","MUHSİN IŞIK","RAMAZAN KURAL","RAMAZAN UZUNALP","GÜRKAN EYÜPOĞLU","VEDAT ÖZTÜRK","BİLAL DENERİ","VEPA","GÖKHAN YEŞİLBAŞ","EREN YILMAZ","İSMAİL ALBAYRAK","MURAT KAYA","MUHSİN ÖZMERT","EMİRHAN KANDEMİR","AZAT ASLANGRİ","RIZVAN FINDIK","K. ENDER KIZILKAYA","ERAY SOFUOĞLU","FURKAN ARDA","FERAT GÜNDÜZ","İBRAHİM KARAMAN","YİĞİT ASLANGRİ","TUNCAY ÇAĞLAYAN","ABDULSAMET SEYAR","BATUHAN SEYAR","ALİ BİNGÖL","ALTAN BULUT","YASİN TERCANLI","İSMAİL YAZICI","EMİR ÇAPAR","OĞUZHAN ÇAVUŞOĞLU","TAHSİN CERAN","MUHAMMED ONUR SAMUR","İSMAİL BURAK AKYOL"],
  "Cadde":["CEMAL ÇELİK","ABDULLAH AVCI","CUMHUR YİĞİT","HÜSAMETTİN KÖRPE","SALİH USTA","BURHAN BAYAKIR","ERDAL ÇAVDAR","OKTAY ÇELİK","HİKMET ERDOĞDU","SELİM ORTAHİSAR","MEHMET EMİN MÜDERRİSOĞLU","KÖKSAL SOYKAN","FERHAT AVCI","ERHAN SOFUOĞLU","HASAN ALİ GERZ","MUHAMMET CAN SARICA","BİLAL SÜRİKLİ","HASAN KOÇALAN","UĞUR GÖKER","BEDRETTİN AVCI","EMRE POLAT","SELAHATTİN AVCI","CANER AVCI","ALİ AKKOCA","AZAD MYRADOV","MURAT TORUN","MEHMET ÇELİK","YILMAZ AVCI","RAMAZAN BAYAKIR","ONUR AVCI","MUHAMMET MUSTAFA BAYAKIR","CİHAN AVCI","FURKAN KAVAK","SEPİDEH MENATTİ","MUHAMMET EREN ÇELİK","MURAT DAĞIDIR","SEYFİ ÇELİK","FEVZİ DOLAK","AYDIN AVCI","HAKAN ATMACA","ABDULLAH DENERİ","HAMİT AKPINAR","ADİL EMİR ÇELİK","ABDURRAHMAN KAPAN","SAYIM GÜMÜŞ","YUNUS EMRE ÇELİK","RAMAZAN YAVUZ","ZEYNEP SOFUOĞLU","MUSTAFA AYDIN","HASAN İPEK","KAAN ATASOY","ABDULLAH GÜRKAN","VADETTİN AVCI","ERCAN ALTUN","OSMAN CEYLAN","SEMİH SOFUOĞLU","ABDURRAHMAN ÖZKAN","FIRAT AVCI","MENDERES SOFUOĞLU","HİCABİ AKYILDIZ","ABDURRAHMAN BULUT","MUHİTTİN ÖZÇELİK","MUHAMMET SOFUOĞLU","MUHAMMED MÜMİN ILGAR","MÜSLÜM KANIKARA","BAYRAM YETER"],
  "Cengelkoy":["EMRE BULUT","MURAT GÜNEY","AHMET ÖZÇELİK","TOLGA BULUT","GÜLEN OTAC","VEYSEL YILMAZ","MUSTAFA YILDIRIM","BEYTULLAH ÖMER YAĞMUR","ŞEYMA KARA","KEMAL KÖRPE","BİLAL KAHVECİ","ALİ ÖMER YILMAZ","FATİH İPEK","İSMAİL ŞİMŞEK","TAHİR ŞAHBAZ","SEMİH DÜNDAR","ABDULSAMET YAPRAK","METİN BULUT","OSMAN KAPLAN","RAMAZAN KOÇAL","YAŞAR KEMAL HAN","UĞUR YILMAZ","NECMETTİN AKYILDIZ","AZİM RECEBİ","AZİMYAR ŞAHABUDDİN"]
};
var current=BRANCHES[0];
var state=load();

function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}var s={};BRANCHES.forEach(b=>s[b]={people:(SEED[b]||[]).map(n=>({name:n,ms:0,hs:0,izin:0,yol:0,yillik:0,ceza:0,prim:0,dis:0}))});return s;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast("Kaydedildi");}
function calc(p,b){
  var r=RATES[b]||RATES.Kadıköy;
  var mesai=(p.ms||0)*r.saat, hs=(p.hs||0)*r.hs, izin=(p.izin||0)*r.izin;
  return {mesai,hs,izin,yol:p.yol||0,yillik:p.yillik||0,ceza:p.ceza||0,prim:p.prim||0,dis:p.dis||0,toplam:mesai+hs+izin+(p.yol||0)+(p.yillik||0)+(p.prim||0)+(p.dis||0)-(p.ceza||0)};
}
function tl(n){return Math.round(n||0).toLocaleString("tr-TR");}
function dash(n){return Math.round(n||0)===0?"-":tl(n);}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}

function renderBar(){
  var h="";
  BRANCHES.forEach(b=>h+='<button class="'+(b===current?"active":"")+'" onclick="selectBranch(\''+b+'\')">'+b+'</button>');
  h+='<button onclick="selectBranch(\'ALL\')">Tüm Şubeler</button>';
  document.getElementById("bar").innerHTML=h;
  var kuryeTab=document.getElementById("tab-kurye");
  if(kuryeTab) kuryeTab.style.display=(current==="Cadde")?"":"none";
}
function selectBranch(b){current=b;render();}
function tab(el){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===el));var id=el.dataset.tab;["liste","duzenle","kurye","devam","ceza","ozet","rapor"].forEach(s=>{var e=document.getElementById("sec-"+s);if(e)e.classList.toggle("hide",s!==id);});}

function render(){
  renderBar();
  var q=(document.getElementById("q").value||"").toLocaleLowerCase("tr-TR");
  var stats=document.getElementById("stats");
  var tbody=document.getElementById("tbody");
  var mobile=document.getElementById("mobileList");
  var sub=document.getElementById("pageSub");
  if(current==="ALL"){
    var grand=0,rows="",mrows="";
    BRANCHES.forEach(b=>{var p=state[b].people||[];var s=p.reduce((a,x)=>a+calc(x,b).toplam,0);grand+=s;rows+='<tr><td colspan="13" style="text-align:left;font-weight:700;padding:8px">'+b+' — '+p.length+' kişi — '+tl(s)+' TL</td></tr>';mrows+='<div class="mrow"><b>'+b+'</b> · '+tl(s)+' TL</div>';});
    tbody.innerHTML=rows;mobile.innerHTML=mrows;stats.innerHTML='<div class="stat"><span>Genel Toplam</span><b>'+tl(grand)+' TL</b></div>';sub.textContent="Tüm şubeler · "+tl(grand)+" TL";return;
  }
  var people=(state[current].people||[]).filter(p=>!q||(p.name||"").toLocaleLowerCase("tr-TR").includes(q));
  var sums=people.reduce((a,p)=>{var c=calc(p,current);a.toplam+=c.toplam;a.mesai+=c.mesai;a.hs+=c.hs;a.pay+=c.toplam>0?1:0;return a;},{toplam:0,mesai:0,hs:0,pay:0});
  stats.innerHTML='<div class="stat"><span>Genel toplam</span><b>'+tl(sums.toplam)+' TL</b></div><div class="stat"><span>Ödemesi olan</span><b>'+sums.pay+' / '+people.length+'</b></div><div class="stat"><span>Hafta sonu</span><b>'+tl(sums.hs)+' TL</b></div><div class="stat"><span>Mesai</span><b>'+tl(sums.mesai)+' TL</b></div>';
  sub.textContent=current+" · "+people.length+" kişi · genel toplam "+tl(sums.toplam)+" TL";
  var rows="",mrows="";
  people.forEach((p,i)=>{
    var c=calc(p,current);
    rows+='<tr class="'+(c.toplam>0?"pay":"")+'"><td>'+(i+1)+'</td><td class="name">'+p.name+'</td>'+
      '<td><input type="number" value="'+(p.ms||"")+'" onchange="setVal('+i+',\'ms\',this.value)"></td><td>'+dash(c.mesai)+'</td>'+
      '<td><input type="number" value="'+(p.hs||"")+'" onchange="setVal('+i+',\'hs\',this.value)"></td><td>'+dash(c.hs)+'</td>'+
      '<td>'+dash(c.prim)+'</td><td><input type="number" value="'+(p.yol||"")+'" onchange="setVal('+i+',\'yol\',this.value)"></td>'+
      '<td><input type="number" value="'+(p.izin||"")+'" onchange="setVal('+i+',\'izin\',this.value)"></td><td>'+dash(c.izin)+'</td>'+
      '<td><input type="number" value="'+(p.yillik||"")+'" onchange="setVal('+i+',\'yillik\',this.value)"></td>'+
      '<td><input type="number" value="'+(p.dis||"")+'" onchange="setVal('+i+',\'dis\',this.value)"></td>'+
      '<td class="tot">'+dash(c.toplam)+'</td></tr>';
    mrows+='<div class="mrow"><b>'+p.name+'</b> · '+tl(c.toplam)+' TL</div>';
  });
  tbody.innerHTML=rows||'<tr><td colspan="13">Kayıt yok</td></tr>';
  mobile.innerHTML=mrows||'<div class="mrow">Kayıt yok</div>';
}
function setVal(i,f,v){if(current==="ALL")return;state[current].people[i][f]=v===""?0:+v||0;save();render();}
function exportCSV(){toast("CSV hazırlanıyor...");}
function backup(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="3sube-yedek.json";a.click();}
render();
</script>
</body>
</html>
