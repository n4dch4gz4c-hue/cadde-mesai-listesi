<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>3 Şube Mesai Listesi</title>
<style>
html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933}
.bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
h1{margin:0;font-size:22px}
.btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
.btn.sync{background:#0f7b4c;color:#fff;border-color:#0f7b4c}
table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:3px 4px;text-align:center;color:#111}
td.name{text-align:left;font-weight:700}
tr.pay td.tot{background:#f3e8d2;font-weight:700}
input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 12px}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px}
.table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh}
.branch-bar{display:flex;gap:6px}
.branch-bar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 14px;border-radius:20px}
.branch-bar button.active{background:#fff;color:#0f172a;font-weight:bold}
.hide{display:none!important}
.panel{background:#fff;border:1px solid #d7cfc3;border-radius:12px;padding:12px;margin:12px 16px}
.card{background:#fff;border:1px solid #d7cfc3;border-radius:8px;padding:8px;margin:4px;display:inline-block;min-width:140px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<header class="bar" style="background:#0b1220;color:#fff">
  <div><h1>3 Şube Mesai Listesi</h1><p id="pageSub"></p></div>
  <div class="branch-bar" id="bar"></div>
  <div class="row">
    <input id="q" placeholder="İsim ara..." oninput="render()">
    <button class="btn sync" onclick="toast('Yerel')">Çek</button>
    <button class="btn primary" onclick="save()">Kaydet</button>
    <button class="btn" onclick="backup()">Yedek</button>
  </div>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste</button>
  <button class="tab" data-tab="duzenle" onclick="tab(this)">Düzenleme</button>
  <button class="tab" data-tab="kurye" id="tab-kurye" onclick="tab(this)">Kurye</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Ceza</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Özet</button>
  <button class="tab" data-tab="rapor" onclick="tab(this)">Aylık rapor</button>
</nav>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="table-wrap"><table><thead><tr><th>No</th><th>Ad Soyad</th><th>Mesai saat</th><th>Mesai tutar</th><th>HS adet</th><th>HS tutar</th><th>Prim</th><th>Yol</th><th>İzin gün</th><th>İzin tutar</th><th>Yıllık</th><th>Disiplin</th><th>Toplam</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
<section id="sec-duzenle" class="hide"><div class="panel"><h3>Düzenleme</h3><div class="row"><input id="newName" placeholder="Ad Soyad"><input id="newBirim" type="number" value="300" style="width:70px"><label><input type="checkbox" id="newKurye"> Kurye</label><button class="btn primary" onclick="addPerson()">Ekle</button></div><div id="editList"></div></div></section>
<section id="sec-kurye" class="hide"><div class="panel">Kurye primleri (sadece Cadde).</div></section>
<section id="sec-devam" class="hide"><div class="panel"><h3>Devamsızlık</h3><div class="row"><select id="devamKisi"></select><input id="devamGun" type="number" value="1" style="width:60px"><input id="devamNot" placeholder="Not"><button class="btn primary" onclick="addDevam()">Ekle</button></div><div id="devamList"></div></div></section>
<section id="sec-ceza" class="hide"><div class="panel"><h3>Cezalar</h3><div class="row"><select id="cezaKisi"></select><input id="cezaTutar" type="number" value="1000" style="width:80px"><input id="cezaNeden" placeholder="Neden"><button class="btn primary" onclick="addCeza()">Ekle</button></div><div id="cezaList"></div></div></section>
<section id="sec-ozet" class="hide"><div class="panel" id="ozetContent"></div></section>
<section id="sec-rapor" class="hide"><div class="panel">Aylık rapor (PDF hazırlanıyor).</div></section>
<div id="toast"></div>
<script>
var BRANCHES=["Kadıköy","Cadde","Çengelköy"];
var KEY="3sube_mesai_v15";
var HS_BIRIM=2500;
var RATES={"Kadıköy":{saat:320,izin:2900},"Cadde":{saat:320,izin:2900},"Çengelköy":{saat:280,izin:2800}};
var CADDE_SEED=[{"name":"CEMAL ÇELİK","ms":0,"hs":0,"izin":0,"yol":8000,"yillik":0,"birim":320,"kurye":false},{"name":"ABDULLAH AVCI","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"CUMHUR YİĞİT","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"HÜSAMETTİN KÖRPE","ms":4,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"SALİH USTA","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"BURHAN BAYAKIR","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"ERDAL ÇAVDAR","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"OKTAY ÇELİK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"HİKMET ERDOĞDU","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"SELİM ORTAHİSAR","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MEHMET EMİN MÜDERRİSOĞLU","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"KÖKSAL SOYKAN","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"FERHAT AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"ERHAN SOFUOĞLU","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"HASAN ALİ GERZ","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MUHAMMET CAN SARICA","ms":0,"hs":3,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"BİLAL SÜRİKLİ","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"HASAN KOÇALAN","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"UĞUR GÖKER","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"BEDRETTİN AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"EMRE POLAT","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"SELAHATTİN AVCI","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"CANER AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"ALİ AKKOCA","ms":1.5,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":true},{"name":"AZAD MYRADOV","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"MURAT TORUN","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"MEHMET ÇELİK","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"YILMAZ AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"RAMAZAN BAYAKIR","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"ONUR AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"MUHAMMET MUSTAFA BAYAKIR","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"CİHAN AVCI","ms":0,"hs":1,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"FURKAN KAVAK","ms":0,"hs":0,"izin":1,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"SEPİDEH MENATTİ","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MUHAMMET EREN ÇELİK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MURAT DAĞIDIR","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"SEYFİ ÇELİK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":true},{"name":"FEVZİ DOLAK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":true},{"name":"AYDIN AVCI","ms":2,"hs":2,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"HAKAN ATMACA","ms":0,"hs":3,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"ABDULLAH DENERİ","ms":8,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"HAMİT AKPINAR","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"ADİL EMİR ÇELİK","ms":0,"hs":3,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"ABDURRAHMAN KAPAN","ms":1,"hs":3,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"SAYİM GÜMÜŞ","ms":0,"hs":1,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"YUNUS EMRE ÇELİK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"RAMAZAN YAVUZ","ms":1,"hs":0,"izin":0,"yol":0,"yillik":21850,"birim":270,"kurye":true},{"name":"ZEYNEP SOFUOĞLU","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"MUSTAFA AYDIN","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"HASAN İPEK","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"KAAN ATASOY","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"ABDULLAH GÜRKAN","ms":0,"hs":3,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"VADETTİN AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"ERCAN ALTUN","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"OSMAN CEYLAN","ms":0,"hs":1,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true},{"name":"SEMİH SOFUOĞLU","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"ABDURRAHMAN ÖZKAN","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"FIRAT AVCI","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MENDERES SOFUOĞLU","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"HİCABİ AKYILDIZ","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":300,"kurye":false},{"name":"ABDURRAHMAN BULUT","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"MUHİTTİN ÖZÇELİK","ms":0,"hs":4,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":false},{"name":"MUHAMMET SOFUOĞLU","ms":0,"hs":1,"izin":0,"yol":0,"yillik":0,"birim":320,"kurye":false},{"name":"MUHAMMED MÜMİN ILGAR","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":false},{"name":"MÜSLÜM KANIKARA","ms":0,"hs":0,"izin":0,"yol":0,"yillik":0,"birim":220,"kurye":true},{"name":"BAYRAM YETER","ms":0,"hs":0.5,"izin":0,"yol":0,"yillik":0,"birim":270,"kurye":true}];
var CADDE_CEZA=[{"kisi":"SELİM ORTAHİSAR","tutar":1000,"neden":"TRENDYOL"},{"kisi":"SELAHATTİN AVCI","tutar":2000,"neden":"TRENDYOL"},{"kisi":"HAMİT AKPINAR","tutar":500,"neden":"Tredyol"},{"kisi":"CİHAN AVCI","tutar":500,"neden":"Tredyol"},{"kisi":"HASAN KOÇALAN","tutar":1000,"neden":"Kalitesiz ürün göndermek"},{"kisi":"MUHAMMET SOFUOĞLU","tutar":500,"neden":"TRENDYOLA pişmemiş ürün göndermek"},{"kisi":"AYDIN AVCI","tutar":500,"neden":"TRENDYOLA pişmemiş ürün göndermek"},{"kisi":"UĞUR GÖKER","tutar":1000,"neden":"Trendyol eksik içecek götürmek"}];
var CADDE_DEVAM=[{"kisi":"MUSTAFA AYDIN","gun":1,"not":"Raporlu"},{"kisi":"SAYİM GÜMÜŞ","gun":1,"not":"Raporsuz"},{"kisi":"MUHAMMET CAN SARICA","gun":1,"not":"Raporuz"},{"kisi":"MENDERES SOFUOĞLU","gun":2,"not":"Ücretsiz izin"},{"kisi":"HASAN İPEK","gun":10,"not":"Ücretsiz izin"},{"kisi":"CEMAL ÇELİK","gun":3,"not":"Ücretsiz izin"},{"kisi":"SEMİH SOFUOĞLU","gun":1,"not":"Raporsuz"}];
var current="Cadde";
var state=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}var s={};s.Cadde={people:JSON.parse(JSON.stringify(CADDE_SEED)),cezalar:JSON.parse(JSON.stringify(CADDE_CEZA)),devamsizlik:JSON.parse(JSON.stringify(CADDE_DEVAM))};s.Kadıköy={people:[],cezalar:[],devamsizlik:[]};s["Çengelköy"]={people:[],cezalar:[],devamsizlik:[]};return s;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast("Kaydedildi");}
function calc(p,b){var r=RATES[b]||RATES.Cadde;var saat=p.birim||r.saat;var mesai=(p.ms||0)*saat,hs=(p.hs||0)*HS_BIRIM,izin=(p.izin||0)*r.izin;return {mesai,hs,izin,yol:p.yol||0,yillik:p.yillik||0,toplam:mesai+hs+izin+(p.yol||0)+(p.yillik||0)};}
function tl(n){return Math.round(n||0).toLocaleString("tr-TR");}
function dash(n){return Math.round(n||0)===0?"-":tl(n);}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600);}
function renderBar(){var h="";BRANCHES.forEach(b=>h+='<button class="'+(b===current?"active":"")+'" onclick="selectBranch(\''+b+'\')">'+b+'</button>');document.getElementById("bar").innerHTML=h;var k=document.getElementById("tab-kurye");if(k)k.style.display=(current==="Cadde")?"":"none";}
function selectBranch(b){current=b;render();}
function tab(el){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===el));var id=el.dataset.tab;["liste","duzenle","kurye","devam","ceza","ozet","rapor"].forEach(s=>{var e=document.getElementById("sec-"+s);if(e)e.classList.toggle("hide",s!==id);});if(id==="duzenle")renderEdit();if(id==="ozet")renderOzet();if(id==="devam")renderDevam();if(id==="ceza")renderCeza();}
function fillSelects(){var people=state[current].people||[];var opts='<option value="">Kişi seç</option>'+people.map(p=>'<option>'+p.name+'</option>').join("");var d=document.getElementById("devamKisi");if(d)d.innerHTML=opts;var c=document.getElementById("cezaKisi");if(c)c.innerHTML=opts;}
function render(){renderBar();fillSelects();var people=state[current].people||[];var sums=people.reduce((a,p)=>{var c=calc(p,current);a.toplam+=c.toplam;a.mesai+=c.mesai;a.hs+=c.hs;a.pay+=c.toplam>0?1:0;return a;},{toplam:0,mesai:0,hs:0,pay:0});document.getElementById("stats").innerHTML='<div class="stat"><span>Genel toplam</span><b>'+tl(sums.toplam)+' TL</b></div><div class="stat"><span>Ödemesi olan</span><b>'+sums.pay+' / '+people.length+'</b></div><div class="stat"><span>Hafta sonu</span><b>'+tl(sums.hs)+' TL</b></div><div class="stat"><span>Mesai</span><b>'+tl(sums.mesai)+' TL</b></div>';document.getElementById("pageSub").textContent=current+" · "+people.length+" kişi · "+tl(sums.toplam)+" TL";var rows="";people.forEach((p,i)=>{var c=calc(p,current);var kn=p.kurye?" ᴼ":"";rows+='<tr class="'+(c.toplam>0?"pay":"")+'"><td>'+(i+1)+'</td><td class="name">'+p.name+kn+'</td><td><input type="number" value="'+(p.ms||"")+'" onchange="setVal('+i+',\'ms\',this.value)"></td><td>'+dash(c.mesai)+'</td><td><input type="number" value="'+(p.hs||"")+'" onchange="setVal('+i+',\'hs\',this.value)"></td><td>'+dash(c.hs)+'</td><td>-</td><td><input type="number" value="'+(p.yol||"")+'" onchange="setVal('+i+',\'yol\',this.value)"></td><td><input type="number" value="'+(p.izin||"")+'" onchange="setVal('+i+',\'izin\',this.value)"></td><td>'+dash(c.izin)+'</td><td><input type="number" value="'+(p.yillik||"")+'" onchange="setVal('+i+',\'yillik\',this.value)"></td><td>-</td><td class="tot">'+dash(c.toplam)+'</td></tr>';});document.getElementById("tbody").innerHTML=rows||'<tr><td colspan="13">Kayıt yok</td></tr>';}
function renderEdit(){var people=state[current].people||[];document.getElementById("editList").innerHTML='<table><thead><tr><th>Sıra</th><th>Ad Soyad</th><th>Kurye</th><th>Birim</th><th></th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td><input value="'+(i+1)+'" style="width:40px"></td><td><input value="'+p.name+'" onchange="setName('+i+',this.value)"></td><td><input type="checkbox" '+(p.kurye?"checked":"")+' onchange="setKurye('+i+',this.checked)"></td><td><input type="number" value="'+(p.birim||300)+'" onchange="setBirim('+i+',this.value)"></td><td><button onclick="removePerson('+i+')">Sil</button></td></tr>').join("")+'</tbody></table>';}
function renderOzet(){var people=state[current].people||[];var html='<h3>Kısa özet</h3><table><thead><tr><th>No</th><th>Ad Soyad</th><th>Ödenecek</th></tr></thead><tbody>';people.forEach((p,i)=>{var c=calc(p,current);html+='<tr><td>'+(i+1)+'</td><td class="name">'+p.name+'</td><td>'+dash(c.toplam)+'</td></tr>';});html+='</tbody></table>';document.getElementById("ozetContent").innerHTML=html;}
function renderDevam(){var list=state[current].devamsizlik||[];document.getElementById("devamList").innerHTML='<table><thead><tr><th>No</th><th>Ad Soyad</th><th>Gün</th><th>Not</th><th></th></tr></thead><tbody>'+list.map((d,i)=>'<tr><td>'+(i+1)+'</td><td>'+d.kisi+'</td><td>'+d.gun+'</td><td>'+(d.not||"")+'</td><td><button onclick="removeDevam('+i+')">Sil</button></td></tr>').join("")+'</tbody></table>';}
function renderCeza(){var list=state[current].cezalar||[];document.getElementById("cezaList").innerHTML=list.map((c,i)=>'<div class="card"><b>'+c.kisi+'</b><div>'+c.tutar+' TL · '+(c.neden||"")+'</div><button onclick="removeCeza('+i+')">Sil</button></div>').join("")||"<p>Kayıt yok</p>";}
function setVal(i,f,v){state[current].people[i][f]=v===""?0:+v||0;save();render();}
function setName(i,v){state[current].people[i].name=v;save();render();}
function setKurye(i,v){state[current].people[i].kurye=v;save();render();}
function setBirim(i,v){state[current].people[i].birim=+v||300;save();render();}
function addPerson(){var n=document.getElementById("newName").value.trim();if(!n){toast("İsim gir");return;}var birim=+document.getElementById("newBirim").value||300;var kurye=document.getElementById("newKurye").checked;state[current].people.push({name:n,ms:0,hs:0,izin:0,yol:0,yillik:0,birim:birim,kurye:kurye});document.getElementById("newName").value="";save();render();renderEdit();}
function removePerson(i){if(!confirm("Silinsin mi?"))return;state[current].people.splice(i,1);save();render();renderEdit();}
function addDevam(){var kisi=document.getElementById("devamKisi").value;if(!kisi){toast("Kişi seç");return;}var gun=+document.getElementById("devamGun").value||1;var not=document.getElementById("devamNot").value;state[current].devamsizlik.push({kisi,gun,not});save();renderDevam();}
function removeDevam(i){state[current].devamsizlik.splice(i,1);save();renderDevam();}
function addCeza(){var kisi=document.getElementById("cezaKisi").value;if(!kisi){toast("Kişi seç");return;}var tutar=+document.getElementById("cezaTutar").value||0;var neden=document.getElementById("cezaNeden").value;state[current].cezalar.push({kisi,tutar,neden});save();renderCeza();}
function removeCeza(i){state[current].cezalar.splice(i,1);save();renderCeza();}
function backup(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="3sube-yedek.json";a.click();}
render();
</script>
