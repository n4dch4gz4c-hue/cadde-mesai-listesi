<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>3 Şube Mesai Listesi</title>
<style>
html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933}
.bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
h1{margin:0;font-size:22px}
.btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
.btn.sync{background:#0f7b4c;color:#fff;border-color:#0f7b4c}
table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:3px 4px;text-align:center;color:#111}
td.name{text-align:left;font-weight:700}
tr.pay td.tot{background:#f3e8d2;font-weight:700}
input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px;font-size:14px;width:64px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 12px}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px}
.table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh}
.branch-bar{display:flex;gap:6px;margin-left:12px}
.branch-bar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 14px;border-radius:20px}
.branch-bar button.active{background:#fff;color:#0f172a;font-weight:bold}
.hide{display:none!important}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:9}
.panel{background:#fff;border:1px solid #d7cfc3;border-radius:12px;padding:12px;margin:12px 16px}
@media(max-width:900px){
  html,body{background:#0b1220!important}
  header.bar{background:#121a2b!important;color:#fff}
  .stats{grid-template-columns:1fr 1fr}
  .stat{background:#1a2438!important;border-color:#2a3a55!important;color:#fff}
  .table-wrap{display:none}
  #mobileList{display:block!important;padding:8px 12px 32px}
  .mrow{background:#fff;border-radius:16px;padding:12px;margin:8px 0}
}
#mobileList{display:none}
</style>
</head>
<body>
<header class="bar" style="background:#0b1220;color:#fff">
  <div><h1>3 Şube Mesai Listesi</h1><p id="pageSub" style="margin:2px 0 0;font-size:13px;opacity:.85"></p></div>
  <div class="branch-bar" id="bar"></div>
  <div class="row">
    <input id="q" placeholder="İsim ara..." oninput="render()">
    <button class="btn sync" onclick="toast('Yerel')">Çek</button>
    <button class="btn primary" onclick="save()">Kaydet</button>
    <button class="btn" onclick="toast('Senkron hazırlanıyor')">Senkron</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="backup()">Yedek</button>
    <button class="btn" onclick="toast('PDF hazırlanıyor')">PDF</button>
  </div>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste</button>
  <button class="tab" data-tab="duzenle" onclick="tab(this)">Düzenleme</button>
  <button class="tab" data-tab="kurye" id="tab-kurye" onclick="tab(this)">Kurye</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Ceza</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Özet</button>
  <button class="tab" data-tab="rapor" onclick="tab(this)">Aylık rapor</button>
</nav>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="table-wrap"><table><thead><tr><th>No</th><th>Ad Soyad</th><th>Mesai saat</th><th>Mesai tutar</th><th>HS adet</th><th>HS tutar</th><th>Prim</th><th>Yol</th><th>İzin gün</th><th>İzin tutar</th><th>Yıllık</th><th>Disiplin</th><th>Toplam</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="mobileList"></div>
</section>
<section id="sec-duzenle" class="hide"><div class="panel"><h3>Düzenleme — <span id="editBranch"></span></h3><div class="row"><input id="newName" placeholder="Ad Soyad"><button class="btn primary" onclick="addPerson()">+ Ekle</button></div><div id="editList"></div></div></section>
<section id="sec-kurye" class="hide"><div class="panel">Kurye (Cadde için).</div></section>
<section id="sec-devam" class="hide"><div class="panel">Devamsızlık kaydı.</div></section>
<section id="sec-ceza" class="hide"><div class="panel">Ceza kaydı.</div></section>
<section id="sec-ozet" class="hide"><div class="panel" id="ozetContent"></div></section>
<section id="sec-rapor" class="hide"><div class="panel">Aylık rapor (hazırlanıyor).</div></section>
<div id="toast"></div>
<script>

": 0, "prim": 0, "dis": 0}, {"name": "SEYFİ ÇELİK", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "FEVZİ DOLAK", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "AYDIN AVCI", "ms": 2, "hs": 2, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "HAKAN ATMACA", "ms": 7, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "CİHAN GENÇ", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "ABDULLAH DENERİ", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "HAMİT AKPINAR", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "ADİL EMİR ÇELİK", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "ABDURRAHMAN KAPAN", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "SAYIM GÜMÜŞ", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "BAYRAM YETER", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "YUNUS EMRE ÇELİK", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "RAMAZAN YAVUZ", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "ZEYNEP SOFUOĞLU", "ms": 0, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "MUSTAFA AYDIN", "ms": 3, "hs": 0, "izin": 0, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "HASAN İPEK", "ms": 0, "hs": 1, "izin": 2, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}, {"name": "KAAN ATASOY", "ms": 0, "hs": 0, "izin": 2, "yol": 0, "yillik": 0, "ceza": 0, "prim": 0, "dis": 0}];
var SEED={"Kadıköy":["ÖZAY ALSAN","ABDULKADİR AKYÜZ","MUHAMMED AKYÜZ","SEDAT KIZILKAYA","MAHMUT TEKER","İSRAFİL ÖZTÜRK","CAFER KOCA","İSA AKYILDIZ","MUHSİN IŞIK","RAMAZAN KURAL","RAMAZAN UZUNALP","GÜRKAN EYÜPOĞLU","VEDAT ÖZTÜRK","BİLAL DENERİ","VEPA","GÖKHAN YEŞİLBAŞ","EREN YILMAZ","İSMAİL ALBAYRAK","MURAT KAYA","MUHSİN ÖZMERT","EMİRHAN KANDEMİR","AZAT ASLANGRİ","RIZVAN FINDIK","K. ENDER KIZILKAYA","ERAY SOFUOĞLU","FURKAN ARDA","FERAT GÜNDÜZ","İBRAHİM KARAMAN","YİĞİT ASLANGRİ","TUNCAY ÇAĞLAYAN","ABDULSAMET SEYAR","BATUHAN SEYAR","ALİ BİNGÖL","ALTAN BULUT","YASİN TERCANLI","İSMAİL YAZICI","EMİR ÇAPAR","OĞUZHAN ÇAVUŞOĞLU","TAHSİN CERAN","MUHAMMED ONUR SAMUR","İSMAİL BURAK AKYOL"],"Çengelköy":["EMRE BULUT","MURAT GÜNEY","AHMET ÖZÇELİK","TOLGA BULUT","GÜLEN OTAC","VEYSEL YILMAZ","MUSTAFA YILDIRIM","BEYTULLAH ÖMER YAĞMUR","ŞEYMA KARA","KEMAL KÖRPE","BİLAL KAHVECİ","ALİ ÖMER YILMAZ","FATİH İPEK","İSMAİL ŞİMŞEK","TAHİR ŞAHBAZ","SEMİH DÜNDAR","ABDULSAMET YAPRAK","METİN BULUT","OSMAN KAPLAN","RAMAZAN KOÇAL","YAŞAR KEMAL HAN","UĞUR YILMAZ","NECMETTİN AKYILDIZ","AZİM RECEBİ","AZİMYAR ŞAHABUDDİN"]};
var current=BRANCHES[0];
var state=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}var s={};BRANCHES.forEach(b=>{if(b==="Cadde")s[b]={people:JSON.parse(JSON.stringify(CADDE_SEED))};else s[b]={people:(SEED[b]||[]).map(n=>({name:n,ms:0,hs:0,izin:0,yol:0,yillik:0,ceza:0,prim:0,dis:0}))};});return s;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast("Kaydedildi");}
function calc(p,b){var r=RATES[b]||RATES.Kadıköy;var mesai=(p.ms||0)*r.saat,hs=(p.hs||0)*r.hs,izin=(p.izin||0)*r.izin;return {mesai,hs,izin,yol:p.yol||0,yillik:p.yillik||0,ceza:p.ceza||0,prim:p.prim||0,dis:p.dis||0,toplam:mesai+hs+izin+(p.yol||0)+(p.yillik||0)+(p.prim||0)+(p.dis||0)-(p.ceza||0)};}
function tl(n){return Math.round(n||0).toLocaleString("tr-TR");}
function dash(n){return Math.round(n||0)===0?"-":tl(n);}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function renderBar(){var h="";BRANCHES.forEach(b=>h+='<button class="'+(b===current?"active":"")+'" onclick="selectBranch(\''+b+'\')">'+b+'</button>');h+='<button onclick="selectBranch(\'ALL\')">Tüm Şubeler</button>';document.getElementById("bar").innerHTML=h;var k=document.getElementById("tab-kurye");if(k)k.style.display=(current==="Cadde")?"":"none";}
function selectBranch(b){current=b;render();}
function tab(el){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===el));var id=el.dataset.tab;["liste","duzenle","kurye","devam","ceza","ozet","rapor"].forEach(s=>{var e=document.getElementById("sec-"+s);if(e)e.classList.toggle("hide",s!==id);});if(id==="duzenle")renderEdit();if(id==="ozet")renderOzet();}
function render(){renderBar();var q=(document.getElementById("q").value||"").toLocaleLowerCase("tr-TR");var stats=document.getElementById("stats");var tbody=document.getElementById("tbody");var mobile=document.getElementById("mobileList");var sub=document.getElementById("pageSub");if(current==="ALL"){var grand=0,rows="",mrows="";BRANCHES.forEach(b=>{var p=state[b].people||[];var s=p.reduce((a,x)=>a+calc(x,b).toplam,0);grand+=s;rows+='<tr><td colspan="13" style="text-align:left;font-weight:700;padding:8px">'+b+' — '+p.length+' kişi — '+tl(s)+' TL</td></tr>';mrows+='<div class="mrow"><b>'+b+'</b> · '+tl(s)+' TL</div>';});tbody.innerHTML=rows;mobile.innerHTML=mrows;stats.innerHTML='<div class="stat"><span>Genel Toplam</span><b>'+tl(grand)+' TL</b></div>';sub.textContent="Tüm şubeler · "+tl(grand)+" TL";return;}var people=(state[current].people||[]).filter(p=>!q||(p.name||"").toLocaleLowerCase("tr-TR").includes(q));var sums=people.reduce((a,p)=>{var c=calc(p,current);a.toplam+=c.toplam;a.mesai+=c.mesai;a.hs+=c.hs;a.pay+=c.toplam>0?1:0;return a;},{toplam:0,mesai:0,hs:0,pay:0});stats.innerHTML='<div class="stat"><span>Genel toplam</span><b>'+tl(sums.toplam)+' TL</b></div><div class="stat"><span>Ödemesi olan</span><b>'+sums.pay+' / '+people.length+'</b></div><div class="stat"><span>Hafta sonu</span><b>'+tl(sums.hs)+' TL</b></div><div class="stat"><span>Mesai</span><b>'+tl(sums.mesai)+' TL</b></div>';sub.textContent=current+" · "+people.length+" kişi · genel toplam "+tl(sums.toplam)+" TL";var rows="",mrows="";people.forEach((p,i)=>{var c=calc(p,current);rows+='<tr class="'+(c.toplam>0?"pay":"")+'"><td>'+(i+1)+'</td><td class="name">'+p.name+'</td><td><input type="number" value="'+(p.ms||"")+'" onchange="setVal('+i+',\'ms\',this.value)"></td><td>'+dash(c.mesai)+'</td><td><input type="number" value="'+(p.hs||"")+'" onchange="setVal('+i+',\'hs\',this.value)"></td><td>'+dash(c.hs)+'</td><td>'+dash(c.prim)+'</td><td><input type="number" value="'+(p.yol||"")+'" onchange="setVal('+i+',\'yol\',this.value)"></td><td><input type="number" value="'+(p.izin||"")+'" onchange="setVal('+i+',\'izin\',this.value)"></td><td>'+dash(c.izin)+'</td><td><input type="number" value="'+(p.yillik||"")+'" onchange="setVal('+i+',\'yillik\',this.value)"></td><td><input type="number" value="'+(p.dis||"")+'" onchange="setVal('+i+',\'dis\',this.value)"></td><td class="tot">'+dash(c.toplam)+'</td></tr>';mrows+='<div class="mrow"><b>'+p.name+'</b> · '+tl(c.toplam)+' TL</div>';});tbody.innerHTML=rows||'<tr><td colspan="13">Kayıt yok</td></tr>';mobile.innerHTML=mrows||'<div class="mrow">Kayıt yok</div>';}
function renderEdit(){if(current==="ALL"){document.getElementById("editList").innerHTML="<p>Şube seçin.</p>";return;}document.getElementById("editBranch").textContent=current;var people=state[current].people||[];document.getElementById("editList").innerHTML=people.map((p,i)=>'<div style="padding:6px 0;border-bottom:1px solid #eee"><b>'+(i+1)+'. '+p.name+'</b> <button onclick="removePerson('+i+')">Sil</button></div>').join("")||"<p>Kişi yok</p>";}
function renderOzet(){if(current==="ALL"){document.getElementById("ozetContent").innerHTML="<p>Şube seçin.</p>";return;}var people=state[current].people||[];var sums=people.reduce((a,p)=>{var c=calc(p,current);a.toplam+=c.toplam;a.mesai+=c.mesai;a.hs+=c.hs;return a;},{toplam:0,mesai:0,hs:0});document.getElementById("ozetContent").innerHTML="<h3>"+current+" Özet</h3><p>Toplam: "+tl(sums.toplam)+" TL</p><p>Mesai: "+tl(sums.mesai)+" TL</p><p>HS: "+tl(sums.hs)+" TL</p><p>Kişi: "+people.length+"</p>";}
function setVal(i,f,v){if(current==="ALL")return;state[current].people[i][f]=v===""?0:+v||0;save();render();}
function addPerson(){if(current==="ALL"){toast("Şube seç");return;}var n=document.getElementById("newName").value.trim();if(!n){toast("İsim gir");return;}state[current].people.push({name:n,ms:0,hs:0,izin:0,yol:0,yillik:0,ceza:0,prim:0,dis:0});document.getElementById("newName").value="";save();render();renderEdit();}
function removePerson(i){if(current==="ALL"||!confirm("Silinsin mi?"))return;state[current].people.splice(i,1);save();render();renderEdit();}
function exportCSV(){toast("CSV...");}
function backup(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="3sube-yedek.json";a.click();}
render();
