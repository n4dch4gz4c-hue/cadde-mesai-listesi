<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Cadde Mesai Listesi</title>
<style>html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933} .bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px} h1{margin:0} .btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px} .tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f} table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px} th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0} td{border:1px solid #eadfd2;padding:3px 4px;text-align:center} td.name{text-align:left;font-weight:700} tr.zero td.tot{background:#f8d7da} tr.pay td.tot{background:#f3e8d2;font-weight:700} tfoot td{background:#222;color:#fff} input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px} .sheet input{width:64px;text-align:center} .wide{width:84px} .hide{display:none!important} .panel,.card{background:#fff;border:1px solid #d7cfc3;border-radius:12px;padding:12px;margin:12px 16px} .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px} .stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px} .table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh} .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 24px} #toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;display:none}</style></head>
<body>
<header class="bar"><div><h1>Cadde Mesai Listesi</h1><p id="pageSub"></p></div>
<div class="row"><input id="q" placeholder="İsim ara..." oninput="renderAll()"/><button class="btn" onclick="exportCSV()">CSV</button><button class="btn" onclick="sharePDF()">PDF</button><button class="btn primary" onclick="save()">Kaydet</button></div></header>
<nav class="tabs">
<button class="tab on" data-tab="liste" onclick="tab(this)">Liste / Giriş</button>
<button class="tab" data-tab="kurye" onclick="tab(this)">Kurye prim</button>
<button class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</button>
<button class="tab" data-tab="ceza" onclick="tab(this)">Cezalar</button>
<button class="tab" data-tab="ozet" onclick="tab(this)">Özet</button>
</nav>
<section id="sec-liste"><div class="stats" id="stats"></div><div class="table-wrap"><table class="sheet"><thead><tr><th>No</th><th>Ad Soyad</th><th>Mesai saat</th><th>Mesai tutar</th><th>HS adet</th><th>HS tutar</th><th>Prim</th><th>Yol</th><th>İzin gün</th><th>İzin tutar</th><th>Yıllık</th><th>Disiplin</th><th>Toplam</th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div></section>
<section id="sec-kurye" class="hide"><div class="panel"><h2>Kurye primleri</h2></div><div id="kuryeList" class="cards"></div></section>
<section id="sec-devam" class="hide"><div class="panel"><h2>Devamsızlık</h2><div class="row"><select id="dKisi"></select><input id="dGun" type="number" value="1"/><input id="dNot" placeholder="Not"/><button class="btn primary" onclick="addDevam()">Ekle</button></div></div><div id="devamList" class="cards"></div></section>
<section id="sec-ceza" class="hide"><div class="panel"><h2>Cezalar</h2><div class="row"><select id="cKisi"></select><input id="cTutar" type="number" value="1000"/><input id="cNeden" placeholder="Neden"/><button class="btn primary" onclick="addCeza()">Ekle</button></div></div><div id="cezaList" class="cards"></div></section>
<section id="sec-ozet" class="hide"><div class="panel" id="ozetBox"></div></section>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="seed.js?v=15"></script>
<script src="app.js?v=15"></script>
<script>const KEYX='cadde_bordro_v4';</script>
</body></html>
