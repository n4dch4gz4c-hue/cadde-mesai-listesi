<html lang="tr"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta name="theme-color" content="#0b1220"/>
<title>3 Şube Mesai Listesi</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mesai Listesi"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<script>if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}</script>
<style>
html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933}
.bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
h1{margin:0;font-size:22px}
.btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
.btn.sync{background:#0f7b4c;color:#fff;border-color:#0f7b4c}
table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:3px 4px;text-align:center;color:#111}
td.name{text-align:left;font-weight:700}
tr.pay td.tot{background:#f3e8d2;font-weight:700}
tfoot tr,tfoot td{background:#e8f5e9!important;color:#1b5e20!important;font-weight:700!important}
input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px;font-size:16px}
.sheet input{width:64px;text-align:center;font-size:14px}
.hide{display:none!important}
.panel{background:#fff;border:1px solid #d7cfc3;border-radius:12px;padding:12px;margin:12px 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px}
.table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh}
.branch-bar{display:flex;gap:6px;padding:8px 16px;background:#0b1220}
.branch-bar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer}
.branch-bar button.active{background:#fff;color:#0f172a;font-weight:bold}
#cezaList table.sheet.slim,#kuryeList table.sheet.slim{min-width:0!important;width:100%!important;background:#fff!important;border-collapse:collapse}
#cezaList th,#kuryeList th{background:#c45c26!important;color:#fff!important;padding:8px!important;text-align:center!important}
#cezaList td,#kuryeList td{border:1px solid #eadfd2!important;padding:6px!important;text-align:center!important;color:#111!important;background:#fff!important}
#cezaList td.name,#kuryeList td.name{text-align:left!important;font-weight:700!important}
#cezaList .table-wrap,#kuryeList .table-wrap{padding:0!important;margin-top:12px}
@media(max-width:1024px){
  .branch-bar{position:sticky!important;top:0!important;z-index:100!important;background:#fff!important;padding:10px 8px!important;overflow-x:auto!important;flex-wrap:nowrap!important;border-bottom:1px solid #e0e0e0!important;gap:8px!important}
  .branch-bar button{white-space:nowrap!important;padding:10px 20px!important;font-size:15px!important;background:#f0f0f0!important;color:#333!important;border:1px solid #ddd!important;border-radius:8px!important;font-weight:600!important;box-shadow:none!important}
  .branch-bar button.active{background:#1f4b8f!important;color:#fff!important;border-color:#1f4b8f!important;font-weight:700!important}
  #sec-liste .table-wrap{display:none!important}
  #mobileList{display:block!important;padding:0 8px 20px}
  .stats{grid-template-columns:repeat(2,1fr)!important;padding:8px!important}
  .bar{flex-direction:column;align-items:stretch;padding:8px}
  .bar .row{justify-content:center;flex-wrap:wrap}
  h1{font-size:16px}
  nav.tabs{display:flex!important;flex-wrap:wrap!important;gap:6px!important;padding:8px!important;overflow:visible!important}
  nav.tabs .tab{white-space:nowrap;padding:8px 12px;font-size:13px;flex-shrink:0}
  .mrow{background:#fff;border:1px solid #d7cfc3;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .mrow.pay{border-left:4px solid #0f7b4c}
  .mrow.on{border-color:#1f4b8f}
  .mhead{display:flex;align-items:center;width:100%;padding:14px 12px;background:none;border:none;cursor:pointer;text-align:left}
  .mno{width:32px;height:32px;background:#c45c26;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:12px;flex-shrink:0}
  .mname{flex:1;font-weight:700;font-size:16px;color:#111}
  .mtot{font-weight:700;color:#0f7b4c;font-size:16px}
  .mfields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 14px;background:#f8f6f2}
  .mfields label{display:flex;flex-direction:column;font-size:12px;color:#666;font-weight:600}
  .mfields input{padding:10px;border:1px solid #d7cfc3;border-radius:8px;font-size:16px;margin-top:4px;background:#fff}
  #sec-duzenle .panel,#sec-devam .panel,#sec-ceza .panel,#sec-ozet .panel,#sec-rapor .panel{margin:6px;padding:8px}
  #sec-duzenle .table-wrap,#sec-devam .table-wrap,#sec-ceza .table-wrap,#sec-ozet .table-wrap,#sec-rapor .table-wrap,#devamList .table-wrap,#cezaList .table-wrap{display:block!important;overflow:visible!important;padding:0;max-height:none}
  #sec-duzenle table,#sec-devam table,#sec-ceza table,#sec-ozet table,#sec-rapor table,#devamList table,#cezaList table{min-width:0!important;width:100%!important;font-size:10px!important;table-layout:fixed}
  #sec-duzenle th,#sec-duzenle td,#sec-devam th,#sec-devam td,#sec-ceza th,#sec-ceza td,#sec-ozet th,#sec-ozet td,#sec-rapor th,#sec-rapor td,#devamList th,#devamList td,#cezaList th,#cezaList td{padding:3px 2px!important;font-size:10px!important;word-break:break-word}
  #sec-duzenle input,#sec-devam input,#sec-ceza input{width:100%!important;max-width:none;font-size:12px;padding:4px;box-sizing:border-box}
  #sec-duzenle .row,#sec-devam .row,#sec-ceza .row{flex-wrap:wrap;gap:4px}
  #sec-duzenle .row input,#sec-devam .row input,#sec-devam .row select,#sec-ceza .row input,#sec-ceza .row select{flex:1;min-width:60px;font-size:12px;padding:6px}
  #sec-rapor .stats{grid-template-columns:repeat(2,1fr)!important}
}
@media(min-width:1025px){#mobileList{display:none!important}}
</style></head>
<body>
<div class="branch-bar" id="branchBar"></div>
<header class="bar">
  <div><h1>3 Şube Mesai Listesi</h1><p id="pageSub"></p></div>
  <div class="row">
    <input id="q" placeholder="İsim ara..." oninput="renderAll()"/>
    <button class="btn primary" onclick="save()">Kaydet</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="yedekAl()">Yedek</button>
    <button class="btn" onclick="sharePDF()">PDF</button>
    <button id="allPdfBtn" class="btn hide" onclick="generateAllPdf()" style="background:#7c3aed;color:#fff">Tüm Şubeler</button>
    <button class="btn" onclick="logout()" style="background:#c45c26;color:#fff">Çıkış</button>
  </div>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste</button>
  <button class="tab" data-tab="duzenle" onclick="tab(this)">Düzenleme</button>
  <button class="tab" data-tab="kurye" id="tabKurye" onclick="tab(this)">Kurye</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Ceza</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Özet</button>
  <button class="tab" data-tab="rapor" onclick="tab(this)">Aylık rapor</button>
</nav>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="table-wrap"><table class="sheet"><thead><tr><th>No</th><th>Ad Soyad</th><th>Mesai saat</th><th>Mesai tutar</th><th>HS adet</th><th>HS tutar</th><th>Prim</th><th>Yol</th><th>İzin gün</th><th>İzin tutar</th><th>Yıllık</th><th>Disiplin</th><th>Toplam</th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
  <div id="mobileList"></div>
</section>
<section id="sec-duzenle" class="hide">
  <div class="panel"><h2>Düzenleme</h2><p>İsim düzelt, sırayı taşı veya sil.</p>
    <b>Kişi ekle</b>
    <div class="row"><input id="nAd" placeholder="Ad soyad"/><input id="nBirim" type="number" value="300" style="width:90px"/><label id="kuryeLabel"><input id="nKurye" type="checkbox"/> Kurye</label><button class="btn primary" onclick="addKisi()">Ekle</button></div>
  </div>
  <div id="duzenleList"></div>
</section>
<section id="sec-kurye" class="hide"><div class="panel"><h2>Kurye primleri</h2></div><div id="kuryeList"></div></section>
<section id="sec-devam" class="hide"><div class="panel"><h2>Devamsızlık</h2><div class="row"><select id="dKisi"></select><input id="dGun" type="number" value="1"/><input id="dNot" placeholder="Not"/><button class="btn primary" onclick="addDevam()">Ekle</button></div></div><div id="devamList"></div></section>
<section id="sec-ceza" class="hide"><div class="panel"><h2>Cezalar</h2><div class="row"><select id="cKisi"></select><input id="cTutar" type="number" value="1000"/><input id="cNeden" placeholder="Neden"/><button class="btn primary" onclick="addCeza()">Ekle</button></div></div><div id="cezaList"></div></section>
<section id="sec-ozet" class="hide"><div class="row"><button class="tab on" data-ozet="kisa" onclick="ozetMod('kisa')">Kısa özet</button><button class="tab" data-ozet="ayrinti" onclick="ozetMod('ayrinti')">Ayrıntılı özet</button></div><div class="panel" id="ozetKisa"></div><div class="panel hide" id="ozetAyrinti"></div></section>
<section id="sec-rapor" class="hide"><div class="panel" id="raporBox"></div></section>
<div id="toast"></div>
<script>
var BRANCHES=["Kadıköy","Cadde","Çengelköy"];
var currentBranch=localStorage.getItem("currentBranch")||"Cadde";
function renderBranchBar(){
  var h="";
  var branches=window.BRANCHES||BRANCHES;
  var cur=window.currentBranch||currentBranch;
  branches.forEach(function(b){
    h+='<button class="'+(b===cur?"active":"")+'" onclick="selectBranch(\''+b+'\')">'+b+'</button>';
  });
  document.getElementById("branchBar").innerHTML=h;
  var isCadde=cur==="Cadde";
  var k=document.getElementById("tabKurye");
  if(k) k.style.display=isCadde?"":"none";
  var kl=document.getElementById("kuryeLabel");
  if(kl) kl.style.display=isCadde?"":"none";
}
function selectBranch(b){
  currentBranch=b;
  window.currentBranch=b;
  localStorage.setItem("currentBranch",b);
  if(typeof KEY!=="undefined") KEY="mesai_"+b;
  if(b!=="Cadde"){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var d=JSON.parse(raw);
        if(d.people && d.people.length>50) localStorage.removeItem(KEY);
      }
    }catch(e){}
  }
  renderBranchBar();
  if(typeof load==='function') load();
  var active=document.querySelector(".tab.on");
  if(active && typeof tab==="function") tab(active);
}
renderBranchBar();
</script>

<script src="plus.js?v=113"></script>

<script src="all-pdf.js?v=9"></script>
</body></html>
