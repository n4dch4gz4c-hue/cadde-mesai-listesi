<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta name="theme-color" content="#1f4b8f"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Cadde Mesai Listesi</title>
<script>
if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
function __killGate(){var g=document.getElementById("pcGate");if(g)g.remove();}
setInterval(__killGate,250);
</script>
<style>
html,body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#1f2933}
.bar,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
h1{margin:0;font-size:22px}
.btn,.tab{border:1px solid #d7cfc3;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on,.btn.primary{background:#1f4b8f;color:#fff;border-color:#1f4b8f}
.btn.sync{background:#0f7b4c;color:#fff;border-color:#0f7b4c}
table{border-collapse:collapse;width:100%;min-width:1100px;background:#fff;font-size:13px}
table.slim{min-width:0}
th{background:#c45c26;color:#fff;padding:6px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:3px 4px;text-align:center}
td.name{text-align:left;font-weight:700}
tr.pay td.tot,.pcard.pay .ptot{background:#f3e8d2;font-weight:700}
tfoot td{background:#222;color:#fff}
input,select{padding:6px;border:1px solid #d7cfc3;border-radius:6px;font-size:16px}
.sheet input{width:64px;text-align:center;font-size:14px}
.hide{display:none!important}
.panel,.card,.pcard{background:#fff;border:1px solid #d7cfc3;border-radius:12px;padding:12px;margin:12px 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:10px;padding:10px}
.table-wrap{overflow:auto;padding:0 16px 24px;max-height:70vh}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 24px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;display:none;z-index:9}
#q{min-width:140px;flex:1}
#mobileList{display:none}
@media(max-width:800px){.table-wrap{display:none}#mobileList{display:block;padding-bottom:88px}.stats{grid-template-columns:1fr 1fr}#sec-ozet .table-wrap{display:block!important}}
</style></head>
<body>
<header class="bar">
  <div><h1 onclick="secretTap()">Cadde Mesai Listesi</h1><p id="pageSub"></p></div>
  <div class="row">
    <input id="q" placeholder="Isim ara..." oninput="renderAll()"/>
    <button class="btn sync" onclick="yenileSunucu()">Cek</button>
    <button class="btn primary" onclick="save()">Kaydet</button>
    <button class="btn" onclick="toggleGhBox()">Senkron</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="sharePDF()">PDF</button>
  </div>
</header>
<div id="ghBox" class="panel hide">
  <b>Senkron anahtari</b>
  <div class="row">
    <input id="ghToken" type="password" placeholder="GitHub token"/>
    <input id="ghRepo" placeholder="n4dch4gz4c-hue/cadde-mesai-listesi"/>
    <input id="ghPath" placeholder="cadde-data.json"/>
    <button class="btn" onclick="ghSaveCfg()">Anahtari kaydet</button>
  </div>
</div>
<nav class="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste</button>
  <button class="tab" data-tab="duzenle" onclick="tab(this)">Duzenleme</button>
  <button class="tab" data-tab="kurye" onclick="tab(this)">Kurye</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsizlik</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Ceza</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Ozet</button>
  <button class="tab" data-tab="rapor" onclick="tab(this)">Aylik rapor</button>
</nav>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="panel"><b>Kisi ekle</b><div class="row"><input id="nAd" placeholder="Ad soyad"/><input id="nBirim" type="number" value="300" style="width:90px"/><label><input id="nKurye" type="checkbox"/> Kurye</label><button class="btn primary" onclick="addKisi()">Ekle</button></div></div>
  <div class="table-wrap"><table class="sheet"><thead><tr><th>No</th><th>Ad Soyad</th><th>Mesai saat</th><th>Mesai tutar</th><th>HS adet</th><th>HS tutar</th><th>Prim</th><th>Yol</th><th>Izin gun</th><th>Izin tutar</th><th>Yillik</th><th>Disiplin</th><th>Toplam</th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
  <div id="mobileList"></div>
</section>
<section id="sec-duzenle" class="hide">
  <div class="panel"><h2>Duzenleme</h2><p>Isim duzelt, kurye isaretle, sirayi tasi veya sil.</p></div>
  <div id="duzenleList"></div>
</section>
<section id="sec-kurye" class="hide"><div class="panel"><h2>Kurye primleri</h2></div><div id="kuryeList" class="cards"></div></section>
<section id="sec-devam" class="hide"><div class="panel"><h2>Devamsizlik</h2><div class="row"><select id="dKisi"></select><input id="dGun" type="number" value="1"/><input id="dNot" placeholder="Not"/><button class="btn primary" onclick="addDevam()">Ekle</button></div></div><div id="devamList"></div></section>
<section id="sec-ceza" class="hide"><div class="panel"><h2>Cezalar</h2><div class="row"><select id="cKisi"></select><input id="cTutar" type="number" value="1000"/><input id="cNeden" placeholder="Neden"/><button class="btn primary" onclick="addCeza()">Ekle</button></div></div><div id="cezaList" class="cards"></div></section>
<section id="sec-ozet" class="hide"><div class="row"><button class="tab on" data-ozet="kisa" onclick="ozetMod('kisa')">Kisa ozet</button><button class="tab" data-ozet="ayrinti" onclick="ozetMod('ayrinti')">Ayrintili ozet</button></div><div class="panel" id="ozetKisa"></div><div class="panel hide" id="ozetAyrinti"></div></section>
<section id="sec-rapor" class="hide"><div id="raporBox"></div></section>
<div id="toast"></div>
<button id="asFab" type="button" onclick="toggleAs()">+</button>
<div id="asPanel" class="hide">
  <div id="asHead"><b>Cadde Asistan</b><button type="button" class="btn" onclick="toggleAs()">x</button></div>
  <div id="asMsgs"><div class="as-bot">Komut yaz.</div></div>
  <form id="asForm"><input id="asIn" placeholder="Sor" autocomplete="off"/><button class="btn primary" type="submit">Gonder</button></form>
</div>
<script src="lock.js?v=68"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<script src="seed.js?v=73"></script>
<script src="app.js?v=68"></script>
<script src="gh.js?v=68"></script>
<script src="plus.js?v=68"></script>
<script src="page-extra.js?v=68"></script>
<script src="mobile-fix.js?v=68"></script>
<script src="assistant.js?v=68"></script>
<script src="puter-ai.js?v=68"></script>
<script src="ozet-all.js?v=75"></script>
</body></html>
