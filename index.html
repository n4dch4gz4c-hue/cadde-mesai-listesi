<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8f0ff" />
<title>Cadde Mesai Listesi</title>
<style>
:root{
  --bg:#e8f0ff; --card:#ffffff; --card2:#f4f8ff; --line:#c9d7ee;
  --txt:#122033; --muted:#5a6d88; --acc:#2b6ef6; --good:#1aa05a;
  --warn:#d99200; --bad:#e04b4b; --kurye:#6b4de8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
body{padding:12px 12px 96px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:13px}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{cursor:pointer}
.btn.good{background:#e7f8ee;border-color:#b7e4c7;color:#157a45}
.btn.bad{background:#fdecec;border-color:#f3b4b4;color:#c23030}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:18px}
.stat span{color:var(--muted);font-size:11px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.card.moving{border-color:var(--acc);box-shadow:0 0 0 2px rgba(61,139,253,.35)}
.card.targetish{border-style:dashed}
.movebar{display:flex;gap:6px;margin-top:8px}
.movebar .btn{padding:8px 8px;flex:1;font-size:12px;text-align:center}
.card.kurye{border-color:#cbb8ff}
.name{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name strong{font-size:15px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#efe8ff;color:#5b3cc4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
input[type=number],input[type=text],select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px}
.rowtot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700}
.tiny{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:8px 0 12px;overflow:auto}
.tab{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(232,240,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.foot .btn{flex:1;text-align:center;padding:12px 8px;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
.hide{display:none}
@media(min-width:900px){
  body{max-width:1360px;margin:0 auto;padding:22px 28px 110px;font-size:17px}
  h1{font-size:30px}
  .sub{font-size:15px}
  .pill,.btn{padding:10px 16px;font-size:15px}
  .tab{padding:11px 18px;font-size:16px}
  .stat{padding:16px 18px}
  .stat b{font-size:26px}
  .stat span{font-size:13px}
  .search{padding:14px 16px;font-size:18px}
  .card{padding:18px;margin-bottom:14px}
  .name strong{font-size:19px}
  .badge{font-size:13px}
  .tiny{font-size:13px}
  label{font-size:13px}
  input[type=number],input[type=text],select{padding:11px;font-size:17px}
  table{font-size:15px}
  th,td{padding:10px}
  .foot .btn{padding:14px 10px;font-size:16px}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  #list,#hsList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
#printSheet{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  .top,.tabs,.pills,.search,.foot,.modal,section,.btn{display:none !important}
  #printSheet{display:block !important;padding:12px;color:#000}
}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>Cadde Mesai Listesi</h1>
    <div class="sub">Personel listesi · mesai · prim × 7 TL · yol · izin</div>
  </div>
  <button class="btn" onclick="resetData()">Sıfırla</button>
</div>
<div id="ghPanel" class="card hide"></div>
<div class="tabs">
  <div class="tab on" data-tab="liste" onclick="tab(this)">Personel</div>
  <div class="tab" data-tab="hs" onclick="tab(this)">Toplu HS</div>
  <div class="tab" data-tab="kurye" onclick="tab(this)">Kurye prim (7 TL)</div>
  <div class="tab" data-tab="devam" onclick="tab(this)">Devamsızlık</div>
  <div class="tab" data-tab="ceza" onclick="tab(this)">Cezalar</div>
  <div class="tab" data-tab="ozet" onclick="tab(this)">Özet</div>
  <div class="tab" data-tab="finans" onclick="tab(this)">Finansal rapor</div>
</div>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <input class="search" id="q" placeholder="İsim ara..." oninput="renderListe()" />
  <div class="pills">
    <button class="pill on" data-f="hepsi" onclick="filt(this)">Hepsi</button>
    <button class="pill" data-f="kurye" onclick="filt(this)">Kurye</button>
    <button class="pill" data-f="pozitif" onclick="filt(this)">Tutarı olan</button>
    <button class="pill" data-f="sifir" onclick="filt(this)">0 TL</button>
  </div>
  <div id="list"></div>
</section>
<section id="sec-hs" class="hide">
  <div class="card">
    <b>Toplu hafta sonu mesaisi</b>
    <div class="tiny">Saat × 2500 TL. Ortak saati yaz, seç, uygula.</div>
    <div class="grid" style="margin-top:8px">
      <label>Ortak saat<input id="hsTopluSaat" type="number" step="0.5" value="4.5" /></label>
      <label>İsim ara<input id="hsQ" type="text" placeholder="İsim ara..." oninput="renderTopluHs()" /></label>
    </div>
    <div class="pills" style="margin-top:10px">
      <button class="btn" type="button" onclick="hsSec(true)">Hepsini seç</button>
      <button class="btn" type="button" onclick="hsSec(false)">Seçimi kaldır</button>
      <button class="btn good" type="button" onclick="hsUygulaSecili()">Seçilenlere uygula</button>
      <button class="btn" type="button" onclick="hsUygulaHepsine()">Listedekilere uygula</button>
      <button class="btn bad" type="button" onclick="hsSifirlaSecili()">Seçilenleri sıfırla</button>
    </div>
  </div>
  <div id="hsList"></div>
</section>
<section id="sec-kurye" class="hide">
  <div class="card"><b>Kurye primi</b></div>
  <div id="kuryeList"></div>
</section>
<section id="sec-devam" class="hide">
  <div class="card">
    <b>Yeni devamsızlık</b>
    <div class="grid" style="margin-top:8px">
      <label>Kişi<select id="dKisi"></select></label>
      <label>Gün<input id="dGun" type="number" step="0.5" value="1" /></label>
      <label style="grid-column:1/-1">Not<input id="dNot" type="text" /></label>
    </div>
    <button class="btn good" style="margin-top:10px" onclick="addDevam()">Ekle</button>
  </div>
  <div id="devamList"></div>
</section>
<section id="sec-ceza" class="hide">
  <div class="card">
    <b>Yeni ceza</b>
    <div class="grid" style="margin-top:8px">
      <label>Kişi<select id="cKisi"></select></label>
      <label>Tutar TL<input id="cTutar" type="number" step="1" value="1000" /></label>
      <label style="grid-column:1/-1">Neden<input id="cNeden" type="text" /></label>
    </div>
    <button class="btn good" style="margin-top:10px" onclick="addCeza()">Ekle</button>
  </div>
  <div id="cezaList"></div>
</section>
<section id="sec-finans" class="hide"><div id="finansBox"></div></section>
<section id="sec-ozet" class="hide">
  <div class="pills" style="margin-top:0">
    <button class="pill on" data-oz="ayrinti" onclick="setOzetMode(this)">Ayrıntılı</button>
    <button class="pill" data-oz="kisa" onclick="setOzetMode(this)">Kısa özet</button>
  </div>
  <div class="card" id="ozetBox"></div>
</section>
<div id="printSheet"></div>
<div class="foot">
  <button class="btn good" onclick="save()">Kaydet</button>
  <button class="btn" onclick="exportCSV()">CSV</button>
  <button class="btn" onclick="sharePDF()">Paylaş PDF</button>
  <button class="btn" onclick="openAdd()">+ Kişi</button>
</div>
<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalTitle">Kişi</h3>
    <div class="grid" style="grid-template-columns:1fr"><label>Ad Soyad <input id="fName" type="text" /></label></div>
    <div class="grid">
      <label>Sıra <input id="fSira" type="number" step="1" min="1" /></label>
      <label>Mesai saat <input id="fMesai" type="number" step="0.5" /></label>
      <label>Mesai birim TL <input id="fMesaiBirim" type="number" /></label>
      <label id="hsBox" class="hide">Hafta sonu saat <input id="fHs" type="number" step="0.5" /></label>
      <label id="primBox" class="hide">Prim adet <input id="fPrim" type="number" step="1" /></label>
      <label id="yolGunBox" class="hide">Yol gün <input id="fYol" type="number" step="1" /></label>
      <label id="yolBirimBox" class="hide">Yol birim TL <input id="fYolBirim" type="number" /></label>
      <label>İzin tutar <input id="fIzin" type="number" /></label>
      <label>Yıllık izin tutar <input id="fYillik" type="number" /></label>
      <label>Disiplin tutar <input id="fDisk" type="number" /></label>
      <label>Kurye?<select id="fKurye" onchange="document.getElementById('primBox').classList.toggle('hide', this.value!=='1')"><option value="0">Hayır</option><option value="1">Evet</option></select></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn good" onclick="savePerson()">Tamam</button>
      <button class="btn" onclick="closeModal()">Vazgeç</button>
      <button class="btn bad" id="delBtn" onclick="delPerson()">Sil</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
