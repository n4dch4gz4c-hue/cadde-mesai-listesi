<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#e8f0ff"/><title>Cadde Mesai Listesi</title>
<style>:root{--bg:#e8f0ff;--card:#fff;--card2:#f4f8ff;--line:#c9d7ee;--txt:#122033;--muted:#5a6d88;--acc:#2b6ef6;--good:#1aa05a;--bad:#e04b4b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,sans-serif}body{padding:12px 12px 96px}h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;margin-bottom:12px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:13px}.pill.on,.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}.btn{cursor:pointer}.btn.good{background:#e7f8ee;border-color:#b7e4c7;color:#157a45}.btn.bad{background:#fdecec;border-color:#f3b4b4;color:#c23030}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:11px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;margin:6px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.name{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#efe8ff;color:#5b3cc4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}input,select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px}.rowtot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700}.tiny{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:6px;margin:8px 0;overflow:auto}.tab{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:nowrap}.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(232,240,255,.94);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}.foot .btn{flex:1;padding:12px 8px;border-radius:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}.hide{display:none}.movebar{display:flex;gap:6px;margin-top:8px}@media(min-width:900px){body{max-width:1360px;margin:0 auto;padding:22px 28px 110px;font-size:17px}h1{font-size:30px}.stat b{font-size:26px}#list,#hsList{display:grid;grid-template-columns:1fr 1fr;gap:12px}}</style></head><body>
<div class="top"><div><h1>Cadde Mesai Listesi</h1><div class="sub">Personel · mesai · HS · yol</div></div><button class="btn" onclick="resetData()">Sifirla</button></div>
<div class="tabs">
<div class="tab on" data-tab="liste" onclick="tab(this)">Personel</div>
<div class="tab" data-tab="hs" onclick="tab(this)">Toplu HS</div>
<div class="tab" data-tab="kurye" onclick="tab(this)">Kurye prim</div>
<div class="tab" data-tab="devam" onclick="tab(this)">Devamsizlik</div>
<div class="tab" data-tab="ceza" onclick="tab(this)">Cezalar</div>
<div class="tab" data-tab="ozet" onclick="tab(this)">Ozet</div>
<div class="tab" data-tab="finans" onclick="tab(this)">Finansal rapor</div>
</div>
<section id="sec-liste"><div class="stats" id="stats"></div><input class="search" id="q" placeholder="Isim ara..." oninput="renderListe()"/><div class="pills"><button class="pill on" data-f="hepsi" onclick="filt(this)">Hepsi</button><button class="pill" data-f="kurye" onclick="filt(this)">Kurye</button><button class="pill" data-f="pozitif" onclick="filt(this)">Tutari olan</button><button class="pill" data-f="sifir" onclick="filt(this)">0 TL</button></div><div id="list"></div></section>
<section id="sec-hs" class="hide"><div class="card"><b>Toplu hafta sonu mesaisi</b><div class="tiny">Saat x 2500 TL</div><div class="grid"><label>Ortak saat<input id="hsTopluSaat" type="number" step="0.5" value="4.5"/></label><label>Isim ara<input id="hsQ" type="text" oninput="renderTopluHs()"/></label></div><div class="pills"><button class="btn" onclick="hsSec(true)">Hepsini sec</button><button class="btn" onclick="hsSec(false)">Secimi kaldir</button><button class="btn good" onclick="hsUygulaSecili()">Secilenlere uygula</button><button class="btn" onclick="hsUygulaHepsine()">Listedekilere uygula</button><button class="btn bad" onclick="hsSifirlaSecili()">Secilenleri sifirla</button></div></div><div id="hsList"></div></section>
<section id="sec-kurye" class="hide"><div class="card"><b>Kurye primi</b></div><div id="kuryeList"></div></section>
<section id="sec-devam" class="hide"><div class="card"><b>Yeni devamsizlik</b><div class="grid"><label>Kisi<select id="dKisi"></select></label><label>Gun<input id="dGun" type="number" step="0.5" value="1"/></label><label style="grid-column:1/-1">Not<input id="dNot" type="text"/></label></div><button class="btn good" onclick="addDevam()">Ekle</button></div><div id="devamList"></div></section>
<section id="sec-ceza" class="hide"><div class="card"><b>Yeni ceza</b><div class="grid"><label>Kisi<select id="cKisi"></select></label><label>Tutar<input id="cTutar" type="number" value="1000"/></label><label style="grid-column:1/-1">Neden<input id="cNeden" type="text"/></label></div><button class="btn good" onclick="addCeza()">Ekle</button></div><div id="cezaList"></div></section>
<section id="sec-finans" class="hide"><div id="finansBox"></div></section>
<section id="sec-ozet" class="hide"><div class="pills"><button class="pill on" data-oz="ayrinti" onclick="setOzetMode(this)">Ayrintili</button><button class="pill" data-oz="kisa" onclick="setOzetMode(this)">Kisa ozet</button></div><div class="card" id="ozetBox"></div></section>
<div class="foot"><button class="btn good" onclick="save()">Kaydet</button><button class="btn" onclick="exportCSV()">CSV</button><button class="btn" onclick="sharePDF()">Paylas PDF</button><button class="btn" onclick="openAdd()">+ Kisi</button></div>
<div class="modal" id="modal"><div class="sheet"><h3 id="modalTitle">Kisi</h3><div class="grid" style="grid-template-columns:1fr"><label>Ad Soyad <input id="fName" type="text"/></label></div><div class="grid"><label>Sira <input id="fSira" type="number" min="1"/></label><label>Mesai saat <input id="fMesai" type="number" step="0.5"/></label><label>Mesai birim <input id="fMesaiBirim" type="number"/></label><label id="hsBox" class="hide">HS saat <input id="fHs" type="number" step="0.5"/></label><label id="primBox" class="hide">Prim adet <input id="fPrim" type="number"/></label><label id="yolGunBox" class="hide">Yol gun <input id="fYol" type="number"/></label><label id="yolBirimBox" class="hide">Yol birim <input id="fYolBirim" type="number"/></label><label>Izin <input id="fIzin" type="number"/></label><label>Yillik <input id="fYillik" type="number"/></label><label>Disiplin <input id="fDisk" type="number"/></label><label>Kurye?<select id="fKurye" onchange="document.getElementById('primBox').classList.toggle('hide',this.value!=='1')"><option value="0">Hayir</option><option value="1">Evet</option></select></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn good" onclick="savePerson()">Tamam</button><button class="btn" onclick="closeModal()">Vazgec</button><button class="btn bad" id="delBtn" onclick="delPerson()">Sil</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
<script src="boot.js"></script>
</body></html>
