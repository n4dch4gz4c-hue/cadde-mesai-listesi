<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<title>Cadde Mesai Listesi</title>
<link rel="stylesheet" href="app.css?v=14"/>
</head>
<body>
<header class="bar">
  <div>
    <h1>Cadde Mesai Listesi</h1>
    <p class="sub" id="pageSub"></p>
  </div>
  <div class="bar-actions">
    <input id="q" class="search" placeholder="Isim ara..." oninput="renderAll()"/>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="sharePDF()">PDF</button>
    <button class="btn" onclick="resetData()">PDF listesini yukle</button>
    <button class="btn primary" onclick="save()">Kaydet</button>
  </div>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="liste" onclick="tab(this)">Liste / Giris</button>
  <button class="tab" data-tab="kurye" onclick="tab(this)">Kurye prim</button>
  <button class="tab" data-tab="devam" onclick="tab(this)">Devamsizlik</button>
  <button class="tab" data-tab="ceza" onclick="tab(this)">Cezalar</button>
  <button class="tab" data-tab="ozet" onclick="tab(this)">Ozet</button>
</nav>
<section id="sec-liste">
  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table class="sheet">
      <thead>
        <tr>
          <th rowspan="2">No</th>
          <th rowspan="2">Ad Soyad</th>
          <th colspan="2">Mesai</th>
          <th colspan="2">Hafta sonu</th>
          <th>Prim</th>
          <th>Yol</th>
          <th colspan="2">Izin</th>
          <th>Yillik izin</th>
          <th>Disiplin</th>
          <th rowspan="2">Toplam</th>
        </tr>
        <tr>
          <th>Saat</th><th>Tutar</th>
          <th>Adet</th><th>Tutar</th>
          <th>Ekstra</th>
          <th>Tutar</th>
          <th>Gun</th><th>Tutar</th>
          <th>Tutar</th>
          <th>dk</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>
</section>
<section id="sec-kurye" class="hide">
  <div class="panel"><h2>Kurye primleri</h2><p class="sub">Sadece kuryeler. Adet x 7 TL listeye yansir.</p></div>
  <div id="kuryeList" class="cards"></div>
</section>
<section id="sec-devam" class="hide">
  <div class="panel"><h2>Devamsizlik</h2><div class="row">
      <label>Kisi<select id="dKisi"></select></label>
      <label>Gun<input id="dGun" type="number" step="0.5" value="1"/></label>
      <label>Not<input id="dNot" type="text"/></label>
      <button class="btn primary" onclick="addDevam()">Ekle</button>
    </div></div>
  <div id="devamList" class="cards"></div>
</section>
<section id="sec-ceza" class="hide">
  <div class="panel"><h2>Cezalar</h2><div class="row">
      <label>Kisi<select id="cKisi"></select></label>
      <label>Tutar<input id="cTutar" type="number" value="1000"/></label>
      <label>Neden<input id="cNeden" type="text"/></label>
      <button class="btn primary" onclick="addCeza()">Ekle</button>
    </div></div>
  <div id="cezaList" class="cards"></div>
</section>
<section id="sec-ozet" class="hide"><div class="panel" id="ozetBox"></div></section>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="seed.js?v=14"></script>
<script src="app.js?v=14"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});}</script>
</body></html>
