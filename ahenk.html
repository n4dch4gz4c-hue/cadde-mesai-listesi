<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ahenk</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0c10;color:#f4f1ea}
.app{max-width:430px;margin:0 auto;padding:12px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:22px}.brand i{color:#e8c36a;font-style:normal}
.tokens,.tab,.btn,.row,.gate,.pack{border-radius:14px}
.tokens{background:#221e14;border:1px solid #3d3420;color:#e8c36a;padding:6px 11px;font-weight:700}
nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:12px 0}
.tab{background:#12141a;color:#9aa0ae;border:1px solid #2a2d38;padding:9px 0}
.tab.on{color:#fff;border-color:#4a431f}
.card{height:420px;border-radius:22px;background-size:cover;background-position:center;position:relative;border:1px solid #2a2d38}
.shade{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,#0b0c10)}
.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:10px}
.btn{border:0;padding:13px;font-weight:700;color:#fff}
.pass{background:#2a2d38}.like{background:#e8c36a;color:#1a1406}
.hint{color:#9aa0ae;font-size:12px;margin-top:10px}
.row{display:flex;gap:10px;align-items:center;background:#15171e;border:1px solid #2a2d38;padding:10px;margin:8px 0}
.ava{width:48px;height:48px;border-radius:16px;background-size:cover}
.bubble{max-width:80%;padding:10px 12px;border-radius:16px;margin:6px 0}
.me{margin-left:auto;background:#3b2f14}.them{background:#22252e}
input{width:100%;background:#12141a;color:#fff;border:1px solid #2a2d38;border-radius:12px;padding:12px;box-sizing:border-box}
</style></head>
<body>
<div class="app">
<div class="top"><div class="brand">Ahenk<i>.</i></div><button class="tokens" id="tb">&#9670; <span id="bal">80</span></button></div>
<nav>
<button class="tab on" data-t="k">Kesfet</button>
<button class="tab" data-t="s">Sohbet</button>
<button class="tab" data-t="o">Odalar</button>
<button class="tab" data-t="p">Profil</button>
</nav>
<div id="m"></div>
</div>
<script>
const P=[
{id:"ela",n:"Ela",a:27,c:"Kadikoy",b:"Kitap, yuruyus",p:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800&q=80",r:"Bu aksam sakinim."},
{id:"kerem",n:"Kerem",a:29,c:"Besiktas",b:"Muzik, sahil",p:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80",r:"Kahve olur."},
{id:"nisa",n:"Nisa",a:24,c:"Sisli",b:"Yeni sehir",p:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800&q=80",r:"Tasarimdan konusabiliriz."},
{id:"arda",n:"Arda",a:31,c:"Uskudar",b:"Sakin sohbet",p:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800&q=80",r:"Kisa ve net yaz."}
];
const C={start:5,text:1,note:20,call:15,gift:12};
const S={i:0,t:Number(localStorage.ahenk_tokens||80),m:JSON.parse(localStorage.ahenk_m||"[]"),ch:JSON.parse(localStorage.ahenk_ch||"{}"),st:JSON.parse(localStorage.ahenk_st||"{}"),open:null,tab:"k",ok:localStorage.ahenk_ok==="1",name:localStorage.ahenk_nm||""};
function save(){localStorage.ahenk_tokens=S.t;localStorage.ahenk_m=JSON.stringify(S.m);localStorage.ahenk_ch=JSON.stringify(S.ch);localStorage.ahenk_st=JSON.stringify(S.st);localStorage.ahenk_ok=S.ok?"1":"0";localStorage.ahenk_nm=S.name;bal.textContent=S.t}
function spend(n,w){if(S.t<n){alert("Jeton yetersiz");shop();return false}S.t-=n;save();return true}
function person(){return P[S.i%P.length]}
function show(tab){
 S.tab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 if(!S.ok){m.innerHTML=`<div class="gate"><h2>Ahenk</h2><p class="hint">18+ prototip. Gercek odeme yok.</p><input id="nm" placeholder="Adin" value="${S.name}"><div class="actions"><button class="btn like" id="ok">18+, devam</button></div></div>`;ok.onclick=()=>{S.name=nm.value||"Sen";S.ok=true;save();show("k")};return}
 if(tab==="k"){
  const x=person();
  m.innerHTML=`<div class="card" style="background-image:url('${x.p}')"><div class="shade"><h2>${x.n}, ${x.a}</h2><div>${x.c} · ${x.b}</div></div></div><div class="actions"><button class="btn pass" id="pass">Gec</button><button class="btn like" id="like">Uyum</button></div><p class="hint">Sohbet ${C.start} · mesaj ${C.text} · not ${C.note} · gorusme ${C.call}/dk</p>`;
  pass.onclick=()=>{S.i++;show("k")};
  like.onclick=()=>{if(!S.m.includes(x.id))S.m.push(x.id);save();S.i++;show("s")};
 }
 else if(tab==="s"&&!S.open){
  if(!S.m.length){m.innerHTML='<p class="hint">Eslesme yok. Uyum bas.</p>';return}
  m.innerHTML=S.m.map(id=>{const x=P.find(z=>z.id===id);const last=(S.ch[id]||[]).slice(-1)[0];return `<div class="row" onclick="openChat('${id}')"><div class="ava" style="background-image:url('${x.p}')"></div><div><b>${x.n}</b><div class="hint">${last?last.t:('Ac '+C.start+' jeton')}</div></div></div>`}).join("");
 }
 else if(tab==="s"){
  const x=P.find(z=>z.id===S.open);const msgs=S.ch[S.open]||[];
  m.innerHTML=`<div class="row"><div class="ava" style="background-image:url('${x.p}')"></div><b>${x.n}</b></div>${msgs.map(z=>`<div class="bubble ${z.who}">${z.t}</div>`).join("")}<div class="actions" style="grid-template-columns:1fr auto"><input id="msg" placeholder="Yaz..."><button class="btn like" id="send">Git</button></div><div class="actions" style="grid-template-columns:1fr 1fr 1fr"><button class="btn pass" id="note">not ${C.note}</button><button class="btn pass" id="call">ara ${C.call}</button><button class="btn pass" id="gift">hediye ${C.gift}</button></div><p class="hint" id="back">← liste</p>`;
  send.onclick=()=>{const v=msg.value.trim();if(!v||!spend(C.text,"mesaj"))return;push("me",v);push("them",x.r)};
  note.onclick=()=>{if(spend(C.note,"not"))push("me","video not 15sn")};
  call.onclick=()=>{if(spend(C.call,"1dk"))push("them","gorusme 1 dk")};
  gift.onclick=()=>{if(spend(C.gift,"hediye"))push("me","hediye")};
  back.onclick=()=>{S.open=null;show("s")};
 }
 else if(tab==="o"){m.innerHTML='<div class="row"><b>Gece sohbeti</b></div><div class="row"><b>Istanbul yuruyus</b></div><p class="hint">Odalar sonra.</p>'}
 else if(tab==="p"){m.innerHTML=`<p>Ad: ${S.name||"-"}</p><p>Jeton: ${S.t}</p><div class="actions"><button class="btn like" id="buy">Jeton al</button></div>`;
  buy.onclick=shop}
}
function shop(){S.t+=100;save();alert("+100 jeton (sahte)");show("p")}
function openChat(id){if(!S.ch[id])S.ch[id]=[];if(!S.st[id]){if(!spend(C.start,"sohbet"))return;S.st[id]=1;save()}S.open=id;show("s")}
function push(who,t){S.ch[S.open].push({who,t});save();show("s")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.open=null;show(b.dataset.t)});
tb.onclick=shop;save();show("k");
</script></body></html>
